<style>
/* Layout: agenda escura fixa à esquerda (computador) · conteúdo leve à direita · abas embaixo no celular */
:root{
  --f-sans:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ground:#E9EDF1;--paper:#FCFDFD;--ink:#12161C;--muted:#5B6470;--line:#DCE2E8;--line2:#E3E7EC;
  --out:#A0500F;--in:#1D5FA8;--out-tint:#FBEEDF;--out-ink:#8A410D;--ok:#2F6B4F;
  --rail:#12161C;--rail-cell:#2A3340;--rail-text:#F1F3F5;--rail-muted:#8C95A1;--rail-dim:#7E8894;--warn:#F2A35E;--rail-accent:#7CC7A0;
  --visor:#12161C;--visor-out:#F2C79B;--visor-in:#A9CBF2;--visor-neutral:#F1F3F5;
  --btn:#12161C;--btn-ink:#FCFDFD;
  --a4:#FFFFFF;--a4-ink:#12161C;--a4-muted:#5B6470;--a4-line:#E3E7EC;--a4-out:#A0500F;--a4-in:#1D5FA8;
  --big-font:var(--f-sans);--big-bg:transparent;--big-ink:var(--ink);--big-pad:0px;--big-ls:-0.035em;
  --shadow:0 18px 40px rgba(18,22,28,.07);
  --lg-bg:linear-gradient(140deg,#4FB98A 0%,#2F8F64 55%,#2F6B4F 100%);--in-tint:#E3EEFA;--ok-tint:rgba(47,107,79,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1116;--paper:#171B22;--ink:#EEF1F4;--muted:#9AA3AE;--line:#2A313B;--line2:#222830;
  --out:#F2A35E;--in:#8DB8EE;--out-tint:#2A2018;--out-ink:#F2C79B;--ok:#7CC7A0;
  --rail:#07090C;--rail-cell:#20262E;
  --visor:#07090C;--btn:#EEF1F4;--btn-ink:#0E1116;
  --big-font:var(--f-mono);--big-bg:transparent;--big-ink:#F2C79B;--big-pad:0px;--big-ls:-0.02em;--shadow:none;--lg-bg:linear-gradient(140deg,#123526 0%,#0B1F16 100%);--in-tint:#1B2A3D;--ok-tint:rgba(124,199,160,.2);color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1116;--paper:#171B22;--ink:#EEF1F4;--muted:#9AA3AE;--line:#2A313B;--line2:#222830;
  --out:#F2A35E;--in:#8DB8EE;--out-tint:#2A2018;--out-ink:#F2C79B;--ok:#7CC7A0;
  --rail:#07090C;--rail-cell:#20262E;
  --visor:#07090C;--btn:#EEF1F4;--btn-ink:#0E1116;
  --big-font:var(--f-mono);--big-bg:transparent;--big-ink:#F2C79B;--big-pad:0px;--big-ls:-0.02em;--shadow:none;--lg-bg:linear-gradient(140deg,#123526 0%,#0B1F16 100%);--in-tint:#1B2A3D;--ok-tint:rgba(124,199,160,.2);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:332px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.logo{font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo span{color:var(--rail-accent)}
.nav{display:flex;flex-direction:column}
.nav button{background:none;border:0;text-align:left;border-radius:10px;color:var(--rail-muted);font-weight:500}
.nav button:hover{color:var(--rail-text);background:var(--rail-cell)}
.nav button[aria-current="page"]{color:var(--rail-text);background:var(--rail-cell)}

.c{height:31px;border-radius:8px;border:0;background:transparent;color:var(--rail-dim);font-size:13px;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.c:hover{box-shadow:inset 0 0 0 1px var(--rail-muted)}
.c.visita{background:var(--rail-cell);color:var(--rail-text)}

.c.falta{background:rgba(242,163,94,.2);color:var(--warn);font-weight:600}
.c.pendente{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}

.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nsec{margin:0 0 6px 12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-dim)}
.nav button{display:flex;align-items:center;gap:12px;width:100%}
.nav button .ico{color:var(--rail-dim)}
.nav button:hover .ico{color:var(--rail-text)}
.nav button[aria-current="page"] .ico{color:var(--rail-accent)}

/* ---------- banco de dados (Supabase) ---------- */
const sb=(window.supabase&&typeof window.supabase.createClient==='function')?window.supabase.createClient('https://irbdmpuhajxspbrvqzre.supabase.co','sb_publishable_rKELxoeBY1oRFwy8kbnSlw_m2g9rXV9'):null;

/* O Supabase devolve no máximo 1000 linhas por vez: busca em partes até acabar */
/* Lê uma tabela inteira em páginas de 1.000 linhas. A primeira página traz o total;
   as demais vêm 4 de cada vez. Se o total não vier, lê uma depois da outra (como antes). */
async function lerTudo(mk){
  const P=1000,r0=await mk(true).range(0,P-1),d0=chk(r0);
  if(d0.length<P)return d0;
  const out=d0.slice(),seq=async i=>{for(;;i+=P){const d=chk(await mk(false).range(i,i+P-1));out.push(...d);if(d.length<P)return out}};
  if(typeof r0.count!=='number')return seq(P);
  const ini=[];for(let i=P;i<r0.count;i+=P)ini.push(i);
  let ult=d0;
  for(let k=0;k<ini.length;k+=4){const lote=await Promise.all(ini.slice(k,k+4).map(i=>mk(false).range(i,i+P-1).then(chk)));for(const d of lote){out.push(...d);ult=d}}
  return ult.length<P?out:seq((ini.length?ini[ini.length-1]:0)+P);
}

/* ================= Materiais (brindes e gráfico) ================= */
const MVAZIO=()=>({pronto:false,falta:false,erro:false,mats:[],pessoas:[],peds:[],movs:[],meus:[],todos:[]});
let M=MVAZIO();

  return lerTudo(c=>{let q=sb.from(tab).select('*',c?{count:'exact'}:undefined);if(filtro)q=filtro(q);for(const x of cols)q=q.order(x,{ascending:true});return q});
}
async function carregarMat(){
  let r;
  const vazio=Promise.resolve([]),tudoMov=leTudoMat(),meuP=PERF&&PERF.pessoa_id&&pode('mat.pedir','editar')?PERF.pessoa_id:null,eu=pedeTodos()&&UI.meuId?UI.meuId:null;
  try{r=await Promise.all([tudo('mat_materiais',['nome','id']),tudo('mat_pessoas',['nome','id']),
    pode('mat.painel','ver')||pode('mat.relatorios','ver')?tudo('mat_pedidos',['data','criado_em','id']):vazio,
    tudoMov?tudo('mat_movimentos',['data','criado_em','id']):vazio,

    tudoMov?Promise.resolve(null):sb.rpc('mat_saldos').then(chk)])}
  catch(e){if(semTabela(e)){M=MVAZIO();M.falta=true;return}throw e}
  const [mt,ps,pd,mv,me,sl]=r,saldo={};
  const movs=mv.map(x=>({id:x.id,date:x.data,tipo:x.tipo,mat:x.material_id,pes:x.pessoa_id||null,q:n0(x.quantidade),ped:x.pedido_id||null,obs:x.observacao||''}));
  if(sl)for(const x of sl)saldo[x.id]=n0(x.saldo);
  else for(const x of movs)saldo[x.mat]=(saldo[x.mat]||0)+(x.tipo==='saida'?-x.q:x.q);

    meus:me.map(x=>({id:x.id,grupo:x.grupo||x.id,date:x.data,mat:x.material_id,pes:x.pessoa_id||null,q:n0(x.quantidade),status:x.status,entregue:x.entregue_em||null,criado:x.criado_em||''})),

function situ(m){if(m.saldo<=0)return 'acabou';if(m.min!=null&&m.saldo<m.min)return 'baixo';if(m.max!=null&&m.saldo>m.max)return 'acima';if(m.min==null&&m.max==null)return 'sem';return 'ok'}
const baixo=m=>m.ativo&&m.min!=null&&m.saldo<m.min;
const comprar=m=>Math.max(0,(m.max!=null?m.max:(m.min!=null?m.min:0))-Math.max(0,m.saldo));
/* Pedidos pendentes, juntando os itens pedidos de uma vez pela mesma pessoa */
function grupos(){
  const g={};
  for(const p of M.peds){(g[p.grupo]=g[p.grupo]||{id:p.grupo,date:p.date,pes:p.pes,criado:p.criado,itens:[]}).itens.push(p)}
  return Object.values(g).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.criado<b.criado?-1:1));
}
/* Quais itens do pedido o estoque de agora cobre */
function cobre(g){
  const resta={},ok=[],falta=[];
  for(const it of g.itens){if(!(it.mat in resta))resta[it.mat]=Math.max(0,matDe(it.mat).saldo);
    if(it.q<=resta[it.mat]){resta[it.mat]-=it.q;ok.push(it)}else falta.push({it,tem:resta[it.mat]})}
  return{ok,falta};
}
const somaQ=a=>a.reduce((s,x)=>s+x.q,0);
const itens=n=>un(n)+' '+(n===1?'item':'itens');

function vPCard(g){
  const p=pesDe(g.pes),c=cobre(g),todos=!c.falta.length,ob=g.itens.find(i=>i.obs);
  let h=`<article class="pcard"><div><p class="pnome">${esc(p.nome)}${p.setor?` <span>· ${esc(p.setor)}</span>`:''}</p><p class="ps">Pedido de ${dl(g.date)}${ob?' · '+esc(ob.obs):''}</p></div>`;
  h+=`<ul class="pitens">${g.itens.map(it=>{const m=matDe(it.mat),f=c.falta.find(x=>x.it.id===it.id);return `<li><span class="pq">${un(it.q)}</span><span class="pn">${esc(m.nome)}</span><span class="pt${f?' falta':''}">${f?(f.tem>0?'Estoque: só '+un(f.tem):'Estoque: 0 · acabou'):'Estoque: '+un(m.saldo)}</span></li>`}).join('')}</ul>`;
  if(!todos)h+=`<p class="paviso">${c.falta.map(f=>`Faltam ${un(f.it.q-f.tem)} de ${esc(matDe(f.it.mat).nome)}`).join('. ')}.${c.ok.length?' Dá para entregar o resto agora; o que faltar continua aqui.':''}</p>`;
  h+='<div class="row">';
  if(todos)h+=`<button class="btn sm" data-act="entregar" data-g="${g.id}">Entregar tudo</button>`;
  else{if(c.ok.length)h+=`<button class="btn sm" data-act="entregarok" data-g="${g.id}">Entregar o que tem</button>`;h+=`<button class="btn ghost sm" data-act="entregar" data-g="${g.id}">Entregar tudo mesmo assim</button>`}
  h+=`<span class="sp"></span><button class="link danger" data-act="cancelped" data-g="${g.id}">Cancelar pedido</button></div></article>`;
  return h;
}

function relPessoas(){
  const ym=UI.mmes,sd=saidas(ym+'-01',fimMes(ym)),por={};
  for(const x of sd){const r=por[x.pes]=por[x.pes]||{pes:x.pes,q:0,itens:[]};r.q+=x.q;r.itens.push(x)}
  const rk=Object.values(por).sort((a,b)=>b.q-a.q),mx=rk.length?rk[0].q:1,tot=somaQ(sd);
  let h=`<div class="hrow">${navMes()}<span class="sub">${itens(tot)} ${tot===1?'entregue':'entregues'}${rk.length?' para '+plural(rk.length,'pessoa','pessoas'):''}</span></div>`;

    let s=`<button class="brow" data-act="mpes" data-id="${r.pes}" aria-expanded="${ab}"><span class="bn">${esc(p.nome)}${p.setor?`<small>${esc(p.setor)}</small>`:''}</span><span class="bb"><i class="bar neu" style="width:${r.q/mx*100}%"></i></span><span class="bv">${un(r.q)}</span></button>`;

      s+=`<div class="det"><ul class="minis">${Object.keys(pm).sort((a,b)=>pm[b]-pm[a]).map(k=>`<li><span>${esc(matDe(k).nome)}</span><span class="en">${un(pm[k])}</span></li>`).join('')}</ul><p class="note">Dias: ${Array.from(new Set(r.itens.map(x=>x.date))).sort().map(dl).join(', ')}.</p></div>`}
    return s}).join('')}</div><p class="note">Toque no nome para ver o que a pessoa pegou e em que dias.</p></section>`;

function colsUso(){
  const ym=UI.mmes,cols=[];
  if((UI.muso||'semana')==='semana'){const ini=ym+'-01',fim=fimMes(ym);for(let s=weekStart(ini);s<=fim;s=add(s,7)){const a=s<ini?ini:s,b=add(s,6)>fim?fim:add(s,6);cols.push({t:a===b?dd(a):dd(a)+' a '+dd(b),a,b})}}
  else{const p=ym.split('-').map(Number);for(let k=5;k>=0;k--){const d=new Date(p[0],p[1]-1-k,1),m=iso(d).slice(0,7);cols.push({t:cap(MESES[d.getMonth()]),a:m+'-01',b:fimMes(m)})}}
  return cols;
}
function relUsoBase(){
  const modo=UI.muso||'semana',cols=colsUso(),sd=saidas(cols[0].a,cols[cols.length-1].b),lin={};
  for(const x of sd){const i=cols.findIndex(c=>x.date>=c.a&&x.date<=c.b);if(i<0)continue;const l=lin[x.mat]=lin[x.mat]||{mat:x.mat,v:cols.map(()=>0),t:0};l.v[i]+=x.q;l.t+=x.q}
  const rows=Object.values(lin).sort((a,b)=>b.t-a.t||porNome(matDe(a.mat),matDe(b.mat)));
  const seg=`<div class="seg" role="group" aria-label="Agrupar por"><button data-act="muso" data-k="semana" aria-pressed="${modo==='semana'}">Semana</button><button data-act="muso" data-k="mes" aria-pressed="${modo==='mes'}">Mês</button></div>`;
  let h=`<div class="hrow">${navMes()}${seg}</div><p class="note">${modo==='semana'?'Quanto saiu de cada material em cada semana do mês (segunda a domingo).':'Quanto saiu de cada material nos últimos seis meses, para ver se o consumo está subindo.'}</p>`;
  if(!rows.length)return h+'<p class="sub">Nenhuma saída neste período.</p>';
  const tc=cols.map((c,i)=>rows.reduce((s,r)=>s+r.v[i],0));
  h+=`<div class="sheetwrap"><table class="sheet mini"><thead><tr><th>Material</th>${cols.map(c=>`<th class="n">${c.t}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(matDe(r.mat).nome)}</td>${r.v.map(v=>`<td class="n${v?'':' z'}">${un(v)}</td>`).join('')}<td class="n"><b>${un(r.t)}</b></td></tr>`).join('')}<tr class="tot"><td>Total</td>${tc.map(v=>`<td class="n">${un(v)}</td>`).join('')}<td class="n">${un(tc.reduce((a,b)=>a+b,0))}</td></tr></tbody></table></div>`;
  return h;
}

async function chamaUsuarios(corpo){
  const r=await sb.functions.invoke('usuarios',{body:corpo});
  if(!r.error&&r.data&&!r.data.erro)return r.data;
  let msg=r.data&&r.data.erro;
  if(!msg&&r.error){const c=r.error.context,st=c&&c.status;let j=null;try{if(c&&typeof c.json==='function')j=await c.json()}catch(e){}
    msg=j&&(j.erro||j.message||j.msg);
    if(msg&&/invalid jwt|jwt/i.test(msg))msg='O Supabase recusou o seu login nessa função. Saia e entre de novo no site; se continuar, avise o responsável.';
    if(!msg)msg=r.error.name==='FunctionsFetchError'?'Não consegui falar com a função "usuarios". Confira no Supabase se ela existe com esse nome exato.':st===404?'A função "usuarios" não foi encontrada no Supabase. Confira se o nome está exatamente assim, em minúsculo.':'A função "usuarios" respondeu com erro '+(st||'')+'. Veja os logs dela no Supabase.'}
  if(!msg)msg='Não foi possível salvar. Verifique a internet e tente de novo.';
  const e=new Error(msg);e.usuario=true;throw e;
}

async function salvaUsuario(){
  const F=UI.acf,novo=F.id==='novo';
  F.nome=valor('af-nome');F.email=valor('af-email').toLowerCase();F.senha=document.getElementById('af-senha').value;F.pessoa=document.getElementById('af-pessoa').value;
  const b=document.getElementById('af-bloq');if(b)F.ativo=!b.checked;
  if(!F.nome){erro('Digite o nome.');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(F.email)){erro('Digite um e-mail válido.');return}
  if(novo&&F.senha.length<8){erro('A senha precisa ter pelo menos 8 caracteres.');return}
  if(!novo&&F.senha&&F.senha.length<8){erro('A nova senha precisa ter pelo menos 8 caracteres.');return}
  if(!F.grupo){erro('Escolha o grupo de acesso.');return}
  if(AC.usuarios.some(u=>u.id!==F.id&&u.email.toLowerCase()===F.email)){erro('Já existe um login com esse e-mail.');return}
  let msg='';
  const todos=F.pessoa==='*',antes=novo?false:(AC.usuarios.find(u=>u.id===F.id)||{}).pessoa==='*';
  const ok=await exec(async()=>{let r;try{r=await chamaUsuarios({acao:novo?'criar':'alterar',id:novo?undefined:F.id,nome:F.nome,email:F.email,senha:F.senha||undefined,grupo_id:F.grupo,pessoa_id:todos?null:(F.pessoa||null),ativo:F.ativo})}catch(e){msg=e.message;throw e}
    const id=novo?r&&r.id:F.id;
    if(AC.todosOk&&id&&(todos||antes)){const x=await sb.rpc('app_usuario_pede_por_todos',{p_user:id,p_valor:todos});if(x.error){msg=x.error.code==='PGRST202'?'Login salvo, mas falta rodar no Supabase a consulta 23 (pedir por qualquer pessoa).':'Login salvo, mas não consegui marcar "Qualquer pessoa": '+(x.error.message||'tente de novo.');const e=new Error(msg);e.usuario=true;throw e}}},null,ACLOAD);
  if(ok){const proprio=!novo&&PERF&&F.id===UI.meuId;UI.acf=null;if(proprio){await carregarPerfil();if(!permitido(UI.view)){go(inicial());return}}render();toast(novo?`Acesso de ${F.nome} criado. Passe o e-mail e a senha para a pessoa.`:`Acesso de ${F.nome} atualizado.`)}
  else if(msg){render();erro(msg)}
}
async function salvaGrupo(){
  const G=UI.grf;G.nome=valor('gf-nome').replace(/\s+/g,' ');G.desc=valor('gf-desc');
  if(!G.nome){erro('Dê um nome para o grupo.');return}
  if(AC.grupos.some(g=>g.id!==G.id&&semAc(g.nome)===semAc(G.nome))){erro('Já existe um grupo com esse nome.');return}
  const perm={};for(const k in G.perm)if(G.perm[k])perm[k]=G.perm[k];
  if(!Object.keys(perm).length){erro('Escolha pelo menos uma parte do site que o grupo acessa.');return}
  const row={nome:G.nome,descricao:G.desc||null,permissoes:perm},velho=G.id!=='novo'?AC.grupos.find(g=>g.id===G.id):null;let id=null;
  const ok=await exec(async()=>{if(velho)chk(await sb.from('app_grupos').update(row).eq('id',velho.id));else id=chk(await sb.from('app_grupos').insert(row).select('id').single()).id},
    async()=>{if(velho)chk(await sb.from('app_grupos').update({nome:velho.nome,descricao:velho.desc||null,permissoes:velho.perm}).eq('id',velho.id));else chk(await sb.from('app_grupos').delete().eq('id',id))},ACLOAD);
  if(ok){UI.grf=null;if(PERF&&!PERF.programador)await carregarPerfil();if(!permitido(UI.view)){go(inicial());toast(`Grupo ${G.nome} salvo. Você não tem mais acesso a esta tela.`);return}render();toast(velho?`Grupo ${G.nome} salvo. Vale na próxima vez que as pessoas abrirem o site.`:`Grupo ${G.nome} criado.`,true)}
}
async function excluiGrupo(id){
  const g=AC.grupos.find(x=>x.id===id);if(!g)return;
  const ok=await exec(async()=>{chk(await sb.from('app_grupos').delete().eq('id',id))},async()=>{chk(await sb.from('app_grupos').insert({id:g.id,nome:g.nome,descricao:g.desc||null,permissoes:g.perm}))},ACLOAD);

    case 'gred':{const g=AC.grupos.find(x=>x.id===id);if(!g)return true;UI.acf=null;UI.grf={id:g.id,nome:g.nome,desc:g.desc,perm:Object.assign({},g.perm)};render();{const f=document.querySelector('.gform');if(f)f.scrollIntoView({block:'start'})}return true}
    case 'grfecha':UI.grf=null;render();return true;
    case 'gver':UI.gver=id;render();return true;
    case 'gperm':{const G=UI.grf,k=b.dataset.k,v=b.dataset.v;if(v)G.perm[k]=v;else delete G.perm[k];b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const r=document.getElementById('gf-res');if(r)r.innerHTML=resumoPerm({perm:G.perm});return true}

const VIEWS=['entrar','m-painel','m-inicio','m-anotar','m-entrada','m-estoque','m-material','m-rel','m-cad','m-inv','m-pedir','m-meus','s-acessos'];
function go(v){
  if(!logado&&v!=='entrar')v='entrar';
  if(v!=='entrar'&&(VIEWS.indexOf(v)<0||!permitido(v)))v=inicial();
  UI.menu=false;
  if(v!=='s-acessos'){UI.acf=null;UI.grf=null}
  if(v==='s-acessos'&&logado&&PERF!==undefined){AC.pronto=false;carregarAcessos().then(()=>{if(UI.view==='s-acessos')render()}).catch(e=>{falha(e);if(UI.view==='s-acessos'){AC.pronto=true;render()}})}
  if(v==='m-material'&&!UI.mat)v='m-estoque';
  if(v!=='m-material')UI.corr=false;
  if(v!=='m-entrada'){UI.ent=null;UI.entVolta=null}
  if(v!=='m-cad')UI.cad=null;
  if((v==='m-anotar'||v==='m-pedir')&&UI.ped&&!Object.keys(UI.ped.q).length)UI.ped.date=HOJE;
  UI.view=v;UI.copyfb=false;
  try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}catch(e){}
  render();
  const m=document.getElementById('main');if(m){window.scrollTo(0,0);m.focus({preventScroll:true})}
}
let tt;

const isAuthErr=e=>!!e&&(e.status===401||e.code==='PGRST301'||/jwt|not authorized|permission denied/i.test(e.message||''));
function falha(e){
  console.error(e);
  if(e&&e.usuario){toast(e.message);return}
  if(e&&/row-level security/i.test(e.message||'')){toast('Seu acesso não permite fazer isso.');return}
  if(isAuthErr(e)){logado=false;toast('Sua sessão expirou. Entre de novo.');go('entrar');return}
  if(e&&e.code==='PGRST202'&&/mat_corrigir/.test(e.message||'')){toast('Falta rodar no Supabase a consulta 17 (correção de estoque).');return}
  if(e&&e.code==='PGRST202'){toast('Falta rodar no Supabase a consulta 09 (entrega de pedidos).');return}
  if(semTabela(e)){toast('Falta rodar no Supabase as consultas 07 a 11 (materiais).');return}
  if(e&&e.code==='23505'){toast('Já existe um cadastro com esse nome.');return}
  toast('Não foi possível salvar. Verifique a internet e tente de novo.');
}
let ocupado=false;
/* Faz a alteração no banco, recarrega tudo e guarda como desfazer */
/* Chama a função do banco que grava tudo de uma vez (consulta 18). Se ela ainda não existir, faz do jeito antigo. */
async function rpcOu(nome,args,antigo){const r=await sb.rpc(nome,args);if(r.error&&r.error.code==='PGRST202')return antigo();return chk(r)}
async function exec(fn,desfazer,loader){
  loader=loader||MLOAD;
  if(ocupado)return false;ocupado=true;document.body.classList.add('busy');
  try{
    /* 1) gravar: se falhar aqui, nada foi salvo */
    try{await fn()}catch(e){falha(e);try{await loader()}catch(_){}render();return false}
    UI.undo=desfazer?{fn:desfazer,loader}:null;
    /* 2) atualizar a tela: se falhar aqui, a gravação já valeu; não pedir para repetir */
    try{await loader()}catch(e){console.error(e);if(isAuthErr(e)){falha(e);return true}setTimeout(()=>toast('Salvo. Só não consegui atualizar a tela: recarregue a página para ver os dados novos.'),0)}
    return true;
  }
  finally{ocupado=false;document.body.classList.remove('busy')}
}
async function desfazer(){
  const u=UI.undo;if(!u)return;UI.undo=null;document.getElementById('toast').hidden=true;
  const ok=await exec(u.fn,null,u.loader);if(ok){render();toast('Desfeito.')}
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(ocupado&&['desfazer','pedagora','pedlater','entregar','entregarok','cancelped','salvaent','salvacorr','delmov','salvapes','arqpes','salvamat','arqmat','salvainv','delped'].indexOf(a)>=0)return;
  if(!acaoLiberada(a)){toast('Seu acesso não permite alterar isso.');return}
  if(ocupado&&['pedenvia','meucancela','acsalva','grsalva','grdel'].indexOf(a)>=0)return;
  if(cliqueAcesso(a,b))return;
  if(cliqueMat(a,b))return;
  switch(a){
    case 'versenha':{const i=document.getElementById('l-senha');if(i){const ver=i.type==='password';i.type=ver?'text':'password';b.textContent=ver?'Ocultar':'Mostrar';b.setAttribute('aria-pressed',String(ver));i.focus()}break}
    case 'go':go(b.dataset.v);break;
    case 'imprimir':window.print();break;
    case 'tema':{const n=temaEscuro()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem(KEYT,n)}catch(e){}render();break}
    case 'sair':(async()=>{try{await sb.auth.signOut()}catch(e){}logado=false;M=MVAZIO();AC={pronto:false,usuarios:[],grupos:[]};PERF=null;SEMACESSO=false;PERFILFALTA=false;UI.undo=null;UI.ped=null;UI.inv=null;UI.menu=false;go('entrar')})();break;
    case 'desfazer':desfazer();break;
  }
});
document.addEventListener('input',ev=>{inputMat(ev.target)});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='af-pessoa'&&UI.acf){UI.acf.pessoa=t.value;const d=document.getElementById('af-dica');if(d)d.innerHTML=dicaPessoa();return}
  changeMat(t);
});
document.addEventListener('submit',async ev=>{
  if(ev.target.id==='loginf'){
    ev.preventDefault();
    const em=document.getElementById('l-email').value.trim(),pw=document.getElementById('l-senha').value,er=document.getElementById('lerr'),bt=document.getElementById('l-btn');
    if(!em||!pw){er.textContent='Preencha o e-mail e a senha.';er.hidden=false;return}
    er.hidden=true;bt.disabled=true;bt.textContent='Entrando…';
    const r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){bt.disabled=false;bt.textContent='Entrar';er.textContent=/invalid/i.test(r.error.message||'')?'E-mail ou senha incorretos.':'Não foi possível entrar agora. Tente de novo.';er.hidden=false;return}
    await entrar();
  }
});
document.addEventListener('keydown',ev=>{
  const t=ev.target;if(ev.key!=='Enter'||!t.classList||!t.classList.contains('invin'))return;
  ev.preventDefault();const a=Array.from(document.querySelectorAll('.invin')),i=a.indexOf(t);if(a[i+1]){a[i+1].focus();a[i+1].select()}else t.blur();
});
setInterval(()=>{const h=iso(new Date());if(h!==HOJE){HOJE=h;if(logado&&!ocupado&&['m-anotar','m-pedir','m-entrada','m-inv','m-cad','s-acessos'].indexOf(UI.view)<0)render()}},60000);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0&&h!==UI.view)go(h)});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;HOJE=iso(new Date());
  if(!logado||ocupado)return;
  if(UI.view.indexOf('s-')===0)return;
  if(['m-anotar','m-entrada','m-cad','m-inv','m-pedir'].indexOf(UI.view)<0&&!UI.corr)carregarMat().then(render).catch(()=>{});
});

function tela(msg){document.getElementById('app').innerHTML=`<div class="carregando"><div class="logo"><span>e</span>Logística</div><p>${msg}</p></div>`}
async function entrar(){
  tela('Carregando…');
  try{
    const ss=await sb.auth.getSession();UI.meuId=ss.data&&ss.data.session&&ss.data.session.user?ss.data.session.user.id:null;
    await carregarPerfil();
    if(SEMACESSO){logado=true;render();return}
    if(temArea('mat.'))await carregarMat().catch(e=>{if(isAuthErr(e))throw e;console.error(e);M=MVAZIO();M.erro=true});logado=true}
  catch(e){console.error(e);if(isAuthErr(e)){logado=false;go('entrar');return}tela('Não foi possível carregar os dados. Verifique a internet e recarregue a página.');return}
  const h=location.hash.slice(1);
  go(VIEWS.indexOf(h)>=0&&h!=='entrar'?h:inicial());
}
try{const t=localStorage.getItem(KEYT);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
if(!sb){tela('Não foi possível carregar o sistema. Verifique a internet e recarregue a página. Se continuar, avise o responsável pelo site.')}
else{
  tela('Carregando…');
  sb.auth.getSession().then(r=>{if(r.data&&r.data.session)entrar();else go('entrar')}).catch(()=>go('entrar'));
}
})();
</script>
