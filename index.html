async function salvaConta(){
  const C=UI.conta,tbr=int(C.tbr),tvm=int(C.tvm),abr=C.abr===''?NaN:int(C.abr),avm=C.avm===''?NaN:int(C.avm);
  if(isNaN(tbr)||isNaN(tvm)||tbr<0||tvm<0){erro('Informe o total de mops da empresa.');return}
  if(isNaN(abr)||isNaN(avm)){erro('Preencha quantos mops estão aqui agora. Pode ser 0.');return}
  if(abr>tbr||avm>tvm){erro('Aqui não pode ter mais mops do que a empresa tem.');return}
  const fbr=tbr-abr,fvm=tvm-avm,velho=Object.assign({},S.total);
  let idC=null,idA=null;
  const ok=await exec(async()=>{
    const r=chk(await sb.rpc('lav_salvar_contagem',{p_total_branco:tbr,p_total_vermelho:tvm,p_aqui_branco:abr,p_aqui_vermelho:avm,p_data:HOJE}));
    idC=r.contagem_id;idA=r.ajuste_id;
  },async()=>{
    chk(await sb.from('lav_total_mops').upsert({id:1,mop_branco:velho.br,mop_vermelho:velho.vm}));
    if(idC)chk(await sb.from('lav_contagens').delete().eq('id',idC));
    if(idA)chk(await sb.from('lav_visitas').delete().eq('id',idA));
  });
  if(ok){go('hoje');toast(`Contagem salva: ${plural(fbr,'branco','brancos')} e ${plural(fvm,'vermelho','vermelhos')} com a lavanderia.`,true)}
}
async function addFeriado(d,nome){
  const antes=feriado(d),fs=faltasDo(d);
  return exec(async()=>{
    chk(await sb.from('lav_feriados').upsert({data:d,nome:nome||'Feriado da cidade',tipo:antes?antes.tipo:'local'}));
    if(fs.length)chk(await sb.from('lav_visitas').delete().in('id',fs.map(f=>f.id)));
  },async()=>{
    if(antes)chk(await sb.from('lav_feriados').upsert({data:d,nome:antes.nome,tipo:antes.tipo}));
    else chk(await sb.from('lav_feriados').delete().eq('data',d));
    await voltaFaltas(fs);
  });
}
async function delFeriado(d){
  const f=feriado(d);if(!f)return;
  const ok=await exec(async()=>{chk(await sb.from('lav_feriados').delete().eq('data',d))},
    async()=>{chk(await sb.from('lav_feriados').insert({data:f.date,nome:f.nome,tipo:f.tipo}))});
  if(ok){render();toast(`Feriado de ${dl(d)} removido.`,true)}
}
async function salvaCfg(){
  const lim=kgVal(document.getElementById('cfg-lim').value),mi=kgVal(document.getElementById('cfg-min').value),ma=kgVal(document.getElementById('cfg-max').value),er=document.getElementById('cerr');
  if([lim,mi,ma].some(isNaN)){er.textContent='Use só números, por exemplo 200 ou 8,5.';er.hidden=false;return}
  if(!(lim>0)){er.textContent='Informe um limite maior que zero.';er.hidden=false;return}
  if(!(ma>0)||mi>=ma||ma>=50){er.textContent='A margem mínima precisa ser menor que a máxima, e a máxima abaixo de 50%.';er.hidden=false;return}
  const velho=Object.assign({},S.config),row=c=>({id:1,limite_camisola_kg:c.limite,sujidade_min_pct:c.smin,sujidade_max_pct:c.smax});
  const ok=await exec(async()=>{chk(await sb.from('lav_config').upsert(row({limite:lim,smin:mi,smax:ma})))},
    async()=>{chk(await sb.from('lav_config').upsert(row(velho)))});
  if(ok){render();toast('Ajustes salvos.',true)}
}
async function desfazer(){
  const u=UI.undo;if(!u)return;UI.undo=null;document.getElementById('toast').hidden=true;
  const ok=await exec(u.fn,null,u.loader);if(ok){render();toast('Desfeito.')}
}
function baixarCSV(){
  const txt=csvGeral();
  const blob=new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eLogistica - planilha geral.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset.d;
  if(ocupado&&['salvar','falta','desfalta','excluir','salvaconta','virafer','delfer','salvacfg','desfazer','pedagora','pedlater','entregar','entregarok','cancelped','salvaent','salvacorr','delmov','salvapes','arqpes','salvamat','arqmat','salvainv'].indexOf(a)>=0)return;
  if(!acaoLiberada(a)){toast('Seu acesso não permite alterar isso.');return}
  if(ocupado&&['pedenvia','meucancela','acsalva','grsalva','grdel'].indexOf(a)>=0)return;
  if(cliqueAcesso(a,b))return;
  if(cliqueMat(a,b))return;
  switch(a){
    case 'go':go(b.dataset.v);break;
    case 'dia':dia(d);break;
    case 'abrir':abrir(d);break;
    case 'novo':abrir(HOJE);break;
    case 'falta':marcarFalta(d);break;
    case 'desfalta':desmarcaFalta(d);break;
    case 'fechaask':UI.ask=null;render();break;
    case 'volta':UI.back++;render();break;
    case 'vai':UI.back=Math.max(0,UI.back-1);render();break;
    case 'step':{const e=UI.edit,s=b.dataset.s,k=b.dataset.k;e[s][k]=Math.max(0,e[s][k]+Number(b.dataset.n));const o=b.parentNode.querySelector('output');o.textContent=e[s][k];o.className=e[s][k]?'':'zero';break}
    case 'salvar':salvar();break;
    case 'excluir':excluir();break;
    case 'cancelar':go('hoje');break;
    case 'salvaconta':salvaConta();break;
    case 'rtab':UI.rtab=b.dataset.k;UI.copyfb=false;render();break;
    case 'mes':{const ms=meses(),i=ms.indexOf(UI.month)+Number(b.dataset.n);if(ms[i]){UI.month=ms[i];UI.copyfb=false;render()}break}
    case 'copiar':{const txt=resumoTexto(dadosMes(UI.month));const fb=()=>{UI.copyfb=true;render();const t=document.getElementById('copyfb');if(t){t.focus();t.select()}toast('Selecione o texto abaixo e copie.')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Resumo copiado. É só colar no WhatsApp ou no e-mail.'),fb)}catch(e){fb()}break}
    case 'planilha':UI.rtab='geral';render();break;
    case 'copiaxls':{const txt=tsvGeral();const fb=()=>{UI.copyfb=true;render();const t=document.getElementById('copyfb');if(t){t.value=txt;t.focus();t.select()}toast('Selecione o texto abaixo e copie.')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Planilha copiada. Cole numa planilha do Excel ou do Google.'),fb)}catch(e){fb()}break}
    case 'csv':baixarCSV();break;
    case 'imprimir':window.print();break;
    case 'virafer':addFeriado(d,'Feriado da cidade').then(ok=>{if(ok){UI.ask=null;go('hoje');toast(`${dl(d)} marcado como feriado. Dá para mudar o nome em Feriados e ajustes.`,true)}});break;
    case 'delfer':delFeriado(d);break;
    case 'salvacfg':salvaCfg();break;
    case 'tema':{const n=temaEscuro()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem(KEYT,n)}catch(e){}render();break}
    case 'sair':(async()=>{try{await sb.auth.signOut()}catch(e){}logado=false;S={recs:[],total:{br:0,vm:0},feriados:[],config:S.config};M=MVAZIO();AC={pronto:false,usuarios:[],grupos:[]};PERF=null;SEMACESSO=false;UI.undo=null;UI.ped=null;UI.inv=null;UI.menu=false;go('entrar')})();break;
    case 'desfazer':desfazer();break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(ehMat()){inputMat(t);return}
  if(UI.view==='registrar'&&UI.edit){
    if(t.id==='f-out-cam')UI.edit.out.cam=kgVal(t.value);
    else if(t.id==='f-in-cam')UI.edit.in.cam=kgVal(t.value);
    else if(t.id==='f-obs'){UI.edit.obs=t.value;return}
    const li=document.getElementById('levainfo');if(li)li.innerHTML=levaInfo();
    const e=document.getElementById('ferr');if(e)e.hidden=true;
  }
  if(UI.view==='contar'&&UI.conta&&/^c-[ta](br|vm)$/.test(t.id)){
    UI.conta[t.id.slice(2)]=t.value.replace(/\D/g,'');
    for(const k of ['br','vm']){const r=document.getElementById('c-r'+k);if(r)r.textContent=foraConta(k)}
    const e=document.getElementById('ferr');if(e)e.hidden=true;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='g-per'){UI.gper=t.value;UI.copyfb=false;render();return}
  if(t.id==='g-tipo'){UI.gtipo=t.value;UI.copyfb=false;render();return}
  if(t.id==='af-pessoa'&&UI.acf){UI.acf.pessoa=t.value;const d=document.getElementById('af-dica');if(d)d.innerHTML=dicaPessoa();return}
  if(changeMat(t))return;
  if(!UI.edit)return;
  if(t.id==='f-date'&&t.value){const d=t.value>HOJE?HOJE:(t.value<=INICIAL.date?add(INICIAL.date,1):t.value);const keep=UI.edit;const v=visitaDe(d);UI.edit=v&&v.id!==keep.id?novoEdit(d):Object.assign({},keep,{date:d});render()}
  if(t.id==='f-urg')UI.edit.urg=t.checked;
});
document.addEventListener('submit',async ev=>{
  if(ev.target.id==='loginf'){
    ev.preventDefault();
    const em=document.getElementById('l-email').value.trim(),pw=document.getElementById('l-senha').value,er=document.getElementById('lerr'),bt=document.getElementById('l-btn');
    if(!em||!pw){er.textContent='Preencha o e-mail e a senha.';er.hidden=false;return}
    er.hidden=true;bt.disabled=true;bt.textContent='Entrando…';
    const r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){bt.disabled=false;bt.textContent='Entrar';er.textContent=/invalid/i.test(r.error.message||'')?'E-mail ou senha incorretos.':'Não foi possível entrar agora. Tente de novo.';er.hidden=false;return}
    await entrar();
  }
  if(ev.target.id==='ferform'){ev.preventDefault();const d=document.getElementById('fer-d').value,n=document.getElementById('fer-n').value.trim(),er=document.getElementById('ferr');
    if(!d){er.textContent='Escolha o dia do feriado.';er.hidden=false;return}
    const ok=await addFeriado(d,n);if(ok){render();toast(`Feriado de ${dl(d)} adicionado.`,true)}}
});
document.addEventListener('keydown',ev=>{
  const t=ev.target;if(ev.key!=='Enter'||!t.classList||!t.classList.contains('invin'))return;
  ev.preventDefault();const a=Array.from(document.querySelectorAll('.invin')),i=a.indexOf(t);if(a[i+1]){a[i+1].focus();a[i+1].select()}else t.blur();
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0&&h!==UI.view)go(h)});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;HOJE=iso(new Date());
  if(!logado||ocupado)return;
  if(ehMat()){if(['m-anotar','m-entrada','m-cad','m-inv'].indexOf(UI.view)<0&&!UI.corr)carregarMat().then(render).catch(()=>{});return}
  if(UI.view.indexOf('s-')===0)return;
  if(temArea('lav.')&&['registrar','contar','ajustes'].indexOf(UI.view)<0)carregar().then(render).catch(()=>{});
});

function tela(msg){document.getElementById('app').innerHTML=`<div class="carregando"><div class="logo"><span>e</span>Logística</div><p>${msg}</p></div>`}
async function entrar(){
  tela('Carregando…');
  try{
    const ss=await sb.auth.getSession();UI.meuId=ss.data&&ss.data.session&&ss.data.session.user?ss.data.session.user.id:null;
    await carregarPerfil();
    if(SEMACESSO){logado=true;render();return}
    await Promise.all([temArea('lav.')?carregar():null,temArea('mat.')?carregarMat().catch(e=>{if(isAuthErr(e))throw e;console.error(e);M=MVAZIO();M.erro=true}):null]);logado=true}
  catch(e){console.error(e);if(isAuthErr(e)){logado=false;go('entrar');return}tela('Não foi possível carregar os dados. Verifique a internet e recarregue a página.');return}
  const h=location.hash.slice(1);
  go(VIEWS.indexOf(h)>=0&&h!=='entrar'?h:inicial());
}
try{const t=localStorage.getItem(KEYT);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
if(!sb){tela('Não foi possível carregar o sistema. Verifique a internet e recarregue a página.')}
else{
  tela('Carregando…');
  sb.auth.getSession().then(r=>{if(r.data&&r.data.session)entrar();else go('entrar')}).catch(()=>go('entrar'));
}
})();
</script>
