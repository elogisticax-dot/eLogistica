<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>eLogística</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* Layout: agenda escura fixa à esquerda (computador) · conteúdo leve à direita · abas embaixo no celular */
:root{
  --f-sans:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ground:#E9EDF1;--paper:#FCFDFD;--ink:#12161C;--muted:#5B6470;--line:#DCE2E8;--line2:#E3E7EC;
  --out:#A0500F;--in:#1D5FA8;--out-tint:#FBEEDF;--out-ink:#8A410D;--ok:#2F6B4F;
  --rail:#12161C;--rail-cell:#2A3340;--rail-extra:#4E5D78;--rail-text:#F1F3F5;--rail-muted:#8C95A1;--rail-dim:#7E8894;--warn:#F2A35E;
  --visor:#12161C;--visor-out:#F2C79B;--visor-in:#A9CBF2;--visor-neutral:#F1F3F5;
  --btn:#12161C;--btn-ink:#FCFDFD;--mop-white:#FFFFFF;--mop-rim:#8E98A4;--mop-red:#D23B3B;
  --a4:#FFFFFF;--a4-ink:#12161C;--a4-muted:#5B6470;--a4-line:#E3E7EC;--a4-out:#A0500F;--a4-in:#1D5FA8;
  --big-font:var(--f-sans);--big-bg:transparent;--big-ink:var(--ink);--big-pad:0px;--big-ls:-0.035em;
  --shadow:0 18px 40px rgba(18,22,28,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1116;--paper:#171B22;--ink:#EEF1F4;--muted:#9AA3AE;--line:#2A313B;--line2:#222830;
  --out:#F2A35E;--in:#8DB8EE;--out-tint:#2A2018;--out-ink:#F2C79B;--ok:#7CC7A0;
  --rail:#07090C;--rail-cell:#20262E;--rail-extra:#3E4C64;
  --visor:#07090C;--btn:#EEF1F4;--btn-ink:#0E1116;--mop-white:#E9EDF1;
  --big-font:var(--f-mono);--big-bg:#07090C;--big-ink:#F2C79B;--big-pad:14px 26px;--big-ls:-0.02em;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1116;--paper:#171B22;--ink:#EEF1F4;--muted:#9AA3AE;--line:#2A313B;--line2:#222830;
  --out:#F2A35E;--in:#8DB8EE;--out-tint:#2A2018;--out-ink:#F2C79B;--ok:#7CC7A0;
  --rail:#07090C;--rail-cell:#20262E;--rail-extra:#3E4C64;
  --visor:#07090C;--btn:#EEF1F4;--btn-ink:#0E1116;--mop-white:#E9EDF1;
  --big-font:var(--f-mono);--big-bg:#07090C;--big-ink:#F2C79B;--big-pad:14px 26px;--big-ls:-0.02em;--shadow:none;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:332px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-text);padding:28px 26px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.logo{font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo span{color:var(--visor-out)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:10px;color:var(--rail-muted);font-weight:500}
.nav button:hover{color:var(--rail-text);background:var(--rail-cell)}
.nav button[aria-current="page"]{color:var(--rail-text);background:var(--rail-cell)}
.agh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.agh>span:first-child{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted)}
.arr{display:flex;gap:4px}
.arr button{width:30px;height:30px;border-radius:8px;border:1px solid var(--rail-cell);background:none;color:var(--rail-text)}
.arr button:disabled{opacity:.3;cursor:default}
.wk{display:grid;gap:6px;align-items:center}
.wh{font-size:12px;text-align:center;color:var(--rail-dim);padding-bottom:4px}
.wh.on{color:var(--rail-text);font-weight:600;border-bottom:2px solid var(--rail-text)}
.wl{font-size:12px;color:var(--rail-muted)}
.c{height:34px;border-radius:8px;border:0;background:transparent;color:var(--rail-dim);font-size:13px;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.c:hover{box-shadow:inset 0 0 0 1px var(--rail-muted)}
.c.visita{background:var(--rail-cell);color:var(--rail-text)}
.c.extra,.c.urg{background:var(--rail-extra);color:var(--rail-text);font-weight:700}
.c.falta{background:rgba(242,163,94,.2);color:var(--warn);font-weight:600}
.c.pendente{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}
.c.previsto{box-shadow:inset 0 0 0 2px var(--rail-cell);color:var(--rail-muted);cursor:default}
.c.today{box-shadow:inset 0 0 0 2px var(--rail-text);color:var(--rail-text);font-weight:700}
.c.sel{background:var(--rail-text);color:var(--rail);font-weight:700;box-shadow:none}
.leg{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:var(--rail-muted)}
.leg li{display:flex;align-items:center;gap:8px}
.lg{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.lg.visita{background:var(--rail-cell)}.lg.extra{background:var(--rail-extra)}
.lg.pendente{box-shadow:inset 0 0 0 2px var(--warn)}.lg.falta{background:rgba(242,163,94,.35)}
.railfoot{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px 14px}
.rlink{background:none;border:0;padding:4px 0;color:var(--rail-muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.rlink:hover{color:var(--rail-text)}

.main{min-width:0;padding-block:40px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:861px){.main{padding-left:56px;padding-right:56px}}
.wrap{max-width:900px;display:flex;flex-direction:column;gap:28px}
.mtop{display:none}
.tabs{display:none}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lbl{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:16px}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:12px;padding:12px 22px;font-weight:600}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.warnbtn{background:var(--out-tint);color:var(--out-ink)}
.link{background:none;border:0;padding:8px 2px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--out-ink)}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sp{flex:1}

.bigwrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.big{margin:0;font-family:var(--big-font);background:var(--big-bg);color:var(--big-ink);padding:var(--big-pad);border-radius:16px;font-size:clamp(60px,11vw,116px);font-weight:700;letter-spacing:var(--big-ls);line-height:1;font-variant-numeric:tabular-nums}
.big .unit{font-size:.36em;letter-spacing:0;font-weight:600;margin-left:.2em}
.limite{display:flex;flex-direction:column;gap:8px;max-width:520px}
.limite p{margin:0;font-size:14px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--muted);border-radius:3px}
.limite.over .meter i{background:var(--out)}
.limite.over p{color:var(--out-ink);font-weight:600}

.mops{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.toks{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tok{width:22px;height:22px;border-radius:50%;display:inline-block;flex:none}
.tok.br{background:var(--mop-white);box-shadow:inset 0 0 0 3px var(--mop-rim)}
.tok.vm{background:var(--mop-red)}
.tok.aqui{opacity:.22}
.tok.sm{width:14px;height:14px;margin-right:8px;vertical-align:-1px}
.tok.br.sm{box-shadow:inset 0 0 0 2px var(--mop-rim)}
.toks .gap{width:12px}
.mcap{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;color:var(--muted);font-size:15px}
.mcap b{color:var(--ink);font-weight:600}
.alerta{margin:0;color:var(--out-ink);font-size:14px}

.ultima{border-top:1px solid var(--line);padding-top:22px;display:flex;flex-direction:column;gap:6px}
.ultima p{margin:0}
.leva{margin:0;color:var(--muted);font-size:14px}
.leva .ok{color:var(--ok)}
.leva .menos,.leva .mais{color:var(--ink);font-weight:500}

.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--out-ink)}
.chip{border:0;border-radius:999px;padding:6px 14px;font-size:14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.chip.warn{box-shadow:inset 0 0 0 2px var(--out);color:var(--out-ink);background:transparent;font-weight:600}
.ask{background:var(--paper);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow), inset 0 0 0 1px var(--line)}
.ask p{margin:0;font-size:16px}
.semana-m{display:none}

.card{background:var(--paper);border-radius:20px;padding:32px 36px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px}
.reg input[type=date]{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.urg{display:flex;align-items:center;gap:10px;font-size:15px;background:var(--out-tint);color:var(--out-ink);padding:10px 14px;border-radius:10px;align-self:flex-start}
.urg input{width:18px;height:18px;accent-color:var(--out)}
.ledger{display:grid;grid-template-columns:minmax(0,1fr) 168px 168px;align-items:center;column-gap:16px}
.ledger>*{padding:12px 0;border-bottom:1px solid var(--line2);min-width:0}
.ledger .lh{font-size:13px;font-weight:700;text-align:right;border-bottom:2px solid var(--ink);padding-top:0}
.ledger>span:first-child{border-bottom:2px solid var(--ink);padding-top:0}
.lh.out{color:var(--out)}.lh.in{color:var(--in)}
.li{font-size:16px;display:flex;align-items:center}
.visor{width:100%;font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--visor);color:var(--visor-out);border:0;border-radius:10px;padding:10px 14px;text-align:right;margin:6px 0}
.visor.in{color:var(--visor-in)}
.visor.neutral{color:var(--visor-neutral)}
.visor::placeholder{color:#8C95A1}
.plain{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:right;background:var(--paper);font-variant-numeric:tabular-nums;margin:6px 0}
.res{text-align:right;font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--out)}
.step{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}
.step button{height:40px;border:0;background:transparent;font-size:18px;color:var(--muted)}
.step button:hover{background:var(--line2);color:var(--ink)}
.step output{text-align:center;font-family:var(--f-mono);font-size:18px;font-weight:600}
.step output.zero{color:var(--muted);font-weight:400}
.ledger.four{grid-template-columns:minmax(0,1fr) 110px 140px 150px}
.err{margin:0;color:var(--out-ink);font-weight:600}

.mnav{display:flex;align-items:center;gap:8px}
.mnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.mnav button:disabled{opacity:.35;cursor:default}
.tablist{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none;background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.frase{margin:0;font-size:24px;font-weight:600;line-height:1.3;text-wrap:balance}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:22px;height:10px;border-radius:3px;display:inline-block}
.sw.out{background:var(--out)}.sw.in{background:var(--in)}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:16px;align-items:center}
.bn{font-weight:600}
.bb{display:flex;flex-direction:column;gap:5px}
.bar{display:block;height:14px;border-radius:3px;min-width:2px}
.bar.zero{min-width:0;height:14px;background:transparent!important}
.bar.out{background:var(--out)}.bar.in{background:var(--in)}
.bv{display:flex;flex-direction:column;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;line-height:19px}
.tout{color:var(--out)}.tin{color:var(--in)}
.fecha{margin:0;font-size:17px;border-top:1px solid var(--line);padding-top:18px}
.fbox{margin:0;color:var(--muted);font-size:14px;max-width:62ch;text-wrap:pretty}
.margem p:last-child,.sub,.note,.leva{max-width:62ch;text-wrap:pretty}
textarea.copyfb{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);font:13px/1.5 var(--f-mono)}

.vlist{display:flex;flex-direction:column}
.vhead,.vrow{display:grid;grid-template-columns:96px minmax(0,1fr) 2px minmax(0,1fr) 190px;gap:10px;align-items:center}
.vhead{font-size:12px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.vrow{padding:9px 0;border:0;border-bottom:1px solid var(--line2);background:none;text-align:left;width:100%}
.vrow:hover{background:var(--line2)}
.vd{font-size:14px;display:flex;flex-direction:column}
.vd small{font-size:11px;color:var(--out-ink);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.vl,.vr{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-variant-numeric:tabular-nums}
.vl{justify-content:flex-end}
.bw{flex:1;display:flex;min-width:0}
.vl .bw{justify-content:flex-end}
.ax{width:2px;align-self:stretch;background:var(--line)}
.vm{font-size:13px;color:var(--muted)}
.vrow.falta,.vrow.pendente{grid-template-columns:96px minmax(0,1fr)}
.vrow.falta .vt,.vrow.pendente .vt{color:var(--out-ink);font-size:14px}
.vrow.ajuste .vt{color:var(--muted);font-size:14px}
.nada{color:var(--muted)}

.a4{--out:var(--a4-out);--in:var(--a4-in);--ink:var(--a4-ink);--muted:var(--a4-muted);--line:var(--a4-line);--line2:var(--a4-line);background:var(--a4);color:var(--a4-ink);border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.12);max-width:640px;width:100%;display:flex;flex-direction:column}
@media (min-width:861px){.a4{min-height:calc(640px * 1.414)}}
.a4h{border-radius:4px 4px 0 0;background:#12161C;color:#F1F3F5;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;font-size:14px}
.a4h .logo{font-size:16px}
.a4b{padding:28px 32px;display:flex;flex-direction:column;gap:16px;flex:1}
.a4b .frase{font-size:22px}
.a4b p{margin:0}
.a4 .brow{grid-template-columns:120px minmax(0,1fr) 70px;font-size:14px}
.a4foot{padding:14px 32px;border-top:1px solid var(--a4-line);font-size:12px;color:var(--a4-muted)}
.note{margin:0;color:var(--muted);font-size:13px}

.dlist{list-style:none;margin:0;padding:0}
.drow{width:100%;display:grid;grid-template-columns:18px 84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ink)}
.dot.pendente,.dot.falta{background:transparent;box-shadow:inset 0 0 0 2px var(--out)}
.dot.falta{background:var(--out-tint)}
.dot.hoje,.dot.previsto{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.dn{font-weight:600}
.ds{color:var(--muted);font-size:14px}
.drow.pendente .ds,.drow.falta .ds{color:var(--out-ink);font-weight:600}
.drow.extra .ds,.drow.urg .ds{color:var(--ink);font-weight:600}
.dk{font-size:13px;font-variant-numeric:tabular-nums}

.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lside{background:var(--rail);color:var(--rail-text);padding:64px max(16px,env(safe-area-inset-left,0px)) 64px 64px;display:flex;flex-direction:column;gap:20px}
.lside .logo{font-size:40px}
.lside p{margin:0;max-width:34ch;color:var(--rail-muted);font-size:18px}
.deco{margin-top:auto;display:grid;grid-template-columns:repeat(3,52px);gap:10px}
.deco i{height:32px;border-radius:8px;background:var(--rail-cell)}
.deco i:nth-child(3),.deco i:nth-child(7){background:transparent;box-shadow:inset 0 0 0 2px var(--warn)}
.lform{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:64px max(16px,env(safe-area-inset-right,0px)) 64px 64px;max-width:460px;width:100%}
.lform label{font-size:13px;color:var(--muted);margin-top:8px}
.lform input{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.lform .btn{margin-top:16px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-block:16px 110px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .mtop .logo span{color:var(--out)}
  .mtop .row{gap:4px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
  .tabs button{flex:1;background:none;border:0;padding:12px 4px;color:var(--muted);font-weight:500}
  .tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
  .semana-m{display:flex;gap:8px;flex-wrap:wrap}
  .semana-m .chip{flex:1;min-width:84px}
  .card{padding:22px 18px;border-radius:16px}
  .ledger{grid-template-columns:minmax(0,1fr) 98px 98px;column-gap:8px}
  .ledger .li{font-size:15px}
  .ledger.four{grid-template-columns:minmax(0,1fr) 62px 80px 80px}
  .visor{font-size:18px;padding:9px 10px}
  .res{font-size:18px}
  .brow{grid-template-columns:96px minmax(0,1fr) 64px;gap:10px}
  .vhead,.vrow{grid-template-columns:62px minmax(0,1fr) 2px minmax(0,1fr)}
  .vhead span:last-child{display:none}
  .vrow .vm{grid-column:2/-1}
  .login{grid-template-columns:minmax(0,1fr)}
  .lside{padding:40px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .deco{display:none}
  .lform{padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  .frase{font-size:20px}
}

}

@media (max-width:860px){.rtable .x{display:none}}
@media (prefers-reduced-motion: no-preference){.btn,.chip,.c,.tab{transition:opacity .15s, background-color .15s, box-shadow .15s}}

<body>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
const DIASL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const COMBINADO=[1,3,5], KEYT='elogistica-tema';
let INICIAL={date:'2026-06-30',cam:0,br:0,vm:0};
const PAL={visita:'visita',extra:'visita extra',urg:'urgência',falta:'falta',pendente:'sem registro',previsto:'previsto',hoje:'hoje',feriado:'feriado',vazio:''};

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
let HOJE=iso(new Date());
const wd=s=>parse(s).getDay();
const dd=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const dl=s=>DIAS[wd(s)]+' '+dd(s);
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const dlong=s=>{const d=parse(s);return cap(DIASL[d.getDay()])+', '+d.getDate()+' de '+MESES[d.getMonth()]};
const kg=n=>{let v=Math.round(n*10)/10;if(Object.is(v,-0))v=0;return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})};
/* Número digitado: aceita 106,5 · 106.5 · 1.234,5. Texto inválido vira NaN (nunca vira 1 ou 0 escondido). */
const kgVal=t=>{t=String(t==null?'':t).trim();if(!t)return 0;let v=NaN;
  if(/^\d+(,\d+)?$/.test(t))v=parseFloat(t.replace(',','.'));
  else if(/^\d+(\.\d+)?$/.test(t))v=parseFloat(t);
  else if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))v=parseFloat(t.replace(/\./g,'').replace(',','.'));
  return v};
const int=t=>{const v=parseInt(String(t).replace(/\D/g,''),10);return isFinite(v)?v:NaN};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,a,b)=>n+' '+(n===1?a:b);
const ord=a=>a.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);

/* ---------- banco de dados (Supabase) ---------- */
const sb=(window.supabase&&typeof window.supabase.createClient==='function')?window.supabase.createClient('https://irbdmpuhajxspbrvqzre.supabase.co','sb_publishable_rKELxoeBY1oRFwy8kbnSlw_m2g9rXV9'):null;
let S={recs:[],total:{br:0,vm:0},feriados:[],config:{limite:200,smin:8,smax:15}};
let logado=false;
const n0=x=>Number(x)||0;
function fromRow(r){
  const b={id:r.id,date:r.data,obs:r.observacao||''};
  if(r.tipo==='falta')return Object.assign(b,{kind:'falta'});
  if(r.tipo==='ajuste')return Object.assign(b,{kind:'ajuste',adj:{cam:n0(r.levou_camisola_kg)-n0(r.trouxe_camisola_kg),br:n0(r.levou_mop_branco)-n0(r.trouxe_mop_branco),vm:n0(r.levou_mop_vermelho)-n0(r.trouxe_mop_vermelho)}});
  return Object.assign(b,{kind:'visita',urg:!!r.urgencia,out:{cam:n0(r.levou_camisola_kg),br:n0(r.levou_mop_branco),vm:n0(r.levou_mop_vermelho)},in:{cam:n0(r.trouxe_camisola_kg),br:n0(r.trouxe_mop_branco),vm:n0(r.trouxe_mop_vermelho)}});
}
const visitaRow=r=>({data:r.date,tipo:'visita',urgencia:!!r.urg,levou_camisola_kg:r.out.cam,levou_mop_branco:r.out.br,levou_mop_vermelho:r.out.vm,trouxe_camisola_kg:r.in.cam,trouxe_mop_branco:r.in.br,trouxe_mop_vermelho:r.in.vm,observacao:r.obs||null});
const chk=r=>{if(r.error)throw r.error;return r.data};
/* O Supabase devolve no máximo 1000 linhas por vez: busca em partes até acabar */
async function todasVisitas(){
  const tudo=[];
  for(let i=0;;i+=1000){
    const d=chk(await sb.from('lav_visitas').select('*').order('data',{ascending:true}).order('criado_em',{ascending:true}).order('id',{ascending:true}).range(i,i+999));
    tudo.push(...d);if(d.length<1000)break;
  }
  return{data:tudo,error:null};
}
async function carregar(){
  const res=await Promise.all([
    todasVisitas(),
    sb.from('lav_saldo_inicial').select('*').eq('id',1).maybeSingle(),
    sb.from('lav_total_mops').select('*').eq('id',1).maybeSingle(),
    sb.from('lav_feriados').select('*').order('data',{ascending:true}),
    sb.from('lav_config').select('*').eq('id',1).maybeSingle()]);
  const [v,i,t,f,c]=res.map(chk);
  S={recs:ord(v.map(fromRow)),
     total:t?{br:n0(t.mop_branco),vm:n0(t.mop_vermelho)}:{br:0,vm:0},
     feriados:f.map(x=>({date:x.data,nome:x.nome,tipo:x.tipo})),
     config:c?{limite:n0(c.limite_camisola_kg),smin:n0(c.sujidade_min_pct),smax:n0(c.sujidade_max_pct)}:{limite:200,smin:8,smax:15}};
  INICIAL=i?{date:i.data,cam:n0(i.camisola_kg),br:n0(i.mop_branco),vm:n0(i.mop_vermelho)}:{date:HOJE,cam:0,br:0,vm:0};
}
const UI={view:'carregando',edit:null,ask:null,back:0,month:null,rtab:'resumo',undo:null,conta:null,copyfb:false,ped:null,ent:null,entVolta:null,mat:null,corr:false,cad:null,mf:'todos',mbusca:'',mrtab:'pessoas',mmes:null,muso:'semana',mpes:null,mper:'todos',mtp:'todos',mmais:false};
const primeiro=()=>S.recs.length?S.recs[0].date:INICIAL.date;

function saldo(ate){
  const b={cam:INICIAL.cam,br:INICIAL.br,vm:INICIAL.vm};
  for(const r of S.recs){
    if(ate&&r.date>ate)break;
    if(r.kind==='visita'){for(const k in b)b[k]+=r.out[k]-r.in[k]}
    else if(r.kind==='ajuste'){for(const k in r.adj)b[k]+=r.adj[k]}
  }
  return b;
}
const doDia=d=>S.recs.filter(r=>r.date===d);
const visitaDe=d=>S.recs.find(r=>r.date===d&&r.kind==='visita');
function status(d){
  const rs=doDia(d), v=rs.find(r=>r.kind==='visita'), comb=COMBINADO.indexOf(wd(d))>=0;
  if(v)return v.urg?'urg':(comb?'visita':'extra');
  if(rs.some(r=>r.kind==='falta'))return 'falta';
  if(feriado(d))return 'feriado';
  if(d>HOJE)return comb?'previsto':'vazio';
  if(d===HOJE)return 'hoje';
  if(comb&&d>=primeiro())return 'pendente';
  return 'vazio';
}
const feriado=d=>S.feriados.find(f=>f.date===d);
const pct=n=>(Math.round(n*10)/10).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
function leva(d){let L=null;for(const r of S.recs){if(r.date>=d)break;if(r.kind==='visita'&&(r.out.cam>0||r.out.br>0||r.out.vm>0))L=r}return L}
/* Faixa de peso limpo esperada para um peso sujo, pela margem de sujidade e umidade */
function faixa(sujo){return{lo:sujo*(1-S.config.smax/100),hi:sujo*(1-S.config.smin/100)}}
function compara(v){
  const L=leva(v.date);if(!L||!(v.in.cam>0)||!(L.out.cam>0))return null;
  return julga(L,v.in.cam);
}
function julga(L,limpo){
  const f=faixa(L.out.cam),diff=limpo-L.out.cam;
  if(limpo>=f.lo&&limpo<=L.out.cam+0.5)return{L,diff,tipo:'ok',txt:limpo>=L.out.cam-0.5?'bateu com a leva':(limpo<=f.hi?'dentro da margem de sujidade':'dentro do esperado'),curto:limpo>=L.out.cam-0.5?'bateu':(limpo<=f.hi?'dentro da margem':'dentro do esperado')};
  if(limpo<f.lo)return{L,diff,tipo:'menos',txt:'pelo menos '+kg(f.lo-limpo)+' kg ficaram com a lavanderia, já descontada a sujidade',curto:kg(f.lo-limpo)+' kg ficaram com a lavanderia'};
  return{L,diff,tipo:'mais',txt:kg(diff)+' kg a mais, do que já estava com a lavanderia',curto:kg(diff)+' kg a mais'};
}
/* Diferença do período entre sujo levado e limpo trazido, comparada à margem */
function margemTxt(out,inn){
  if(out<=0)return '';
  const p=(out-inn)/out*100,f=faixa(out),c=S.config;
  let t=`Levaram ${kg(out)} kg sujos. Descontando de ${c.smin}% a ${c.smax}% de sujidade e umidade, o esperado de volta seria entre ${kg(f.lo)} e ${kg(f.hi)} kg. Trouxeram ${kg(inn)} kg, uma diferença de ${pct(p)}`;
  if(p>=c.smin&&p<=c.smax)t+=': <b>dentro da margem normal</b>. O peso devolvido está dentro da faixa esperada para a lavagem.';
  else if(p<c.smin)t+=p<0?': trouxeram mais do que levaram no período. É normal quando devolvem levas de antes ou por causa da demanda.':': abaixo da margem. Trouxeram um pouco mais do que a lavagem prevê, normalmente por levas de antes.';
  else t+=`: <b>acima da margem</b>. Cerca de ${kg(f.lo-inn)} kg não se explicam pela lavagem. Podem ainda estar com a lavanderia: levas do fim do mês costumam voltar no mês seguinte.`;
  return t;
}
function mops(){
  const b=saldo(),o={};
  for(const k of ['br','vm']){const t=S.total[k],f=Math.max(0,Math.round(b[k]));o[k]={total:t,fora:Math.min(f,t),aqui:Math.max(0,t-f),passou:f>t,calc:f}}
  return o;
}
function lado(o){
  const p=[];if(o.cam>0)p.push(kg(o.cam)+' kg');if(o.br>0)p.push(plural(o.br,'branco','brancos'));if(o.vm>0)p.push(plural(o.vm,'vermelho','vermelhos'));
  if(!p.length)return 'nada';if(p.length===1)return p[0];return p.slice(0,-1).join(', ')+' e '+p[p.length-1];
}
function pendentes(){const a=[];for(let d=add(HOJE,-1);d>=primeiro()&&d>=add(HOJE,-120);d=add(d,-1))if(status(d)==='pendente')a.push(d);return a}
function weekStart(d){const x=parse(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)}
function temaEscuro(){const a=document.documentElement.getAttribute('data-theme');if(a)return a==='dark';return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}

/* ---------- views ---------- */
function navBtn(v,t){return `<button data-act="go" data-v="${v}" ${UI.view===v?'aria-current="page"':''}>${t}</button>`}
function vRail(){
  const ini=add(weekStart(HOJE),-7*(3+UI.back)), sem=[0,1,2,3].map(i=>add(ini,7*i));
  const domingo=sem.some(s=>['visita','extra','urg'].indexOf(status(add(s,6)))>=0), n=domingo?7:6;
  const nomes=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let g=`<div class="wk" style="grid-template-columns:42px repeat(${n},minmax(0,1fr))"><span></span>`;
  for(let i=0;i<n;i++)g+=`<span class="wh${COMBINADO.indexOf((i+1)%7)>=0?' on':''}">${nomes[i]}</span>`;
  for(const s of sem){
    g+=`<span class="wl">${dd(s)}</span>`;
    for(let i=0;i<n;i++){const d=add(s,i),st=status(d),sel=UI.view==='registrar'&&UI.edit&&UI.edit.date===d;
      const fe=feriado(d),dica=(PAL[st]?' · '+PAL[st]:'')+(fe?' · '+fe.nome:'');
      g+=`<button class="c ${st}${d===HOJE?' today':''}${sel?' sel':''}" data-act="dia" data-d="${d}" aria-label="${esc(dl(d)+dica.replace(/ · /g,', '))}" title="${esc(dl(d)+dica)}">${parse(d).getDate()}</button>`}
  }
  g+='</div>';
  return `<aside class="rail">
    <div class="logo"><span>e</span>Logística</div>${vModo()}
    <nav class="nav" aria-label="Principal">${navBtn('hoje','Hoje')}${navBtn('relatorios','Relatórios')}${navBtn('contar','Contar mops')}${navBtn('ajustes','Feriados e ajustes')}</nav>
    <section aria-label="Agenda de visitas">
      <div class="agh"><span>Semanas</span><span class="arr"><button data-act="volta" aria-label="Semanas anteriores">‹</button><button data-act="vai" aria-label="Semanas seguintes" ${UI.back===0?'disabled':''}>›</button></span></div>
      ${g}
      <ul class="leg"><li><i class="lg visita"></i>visita</li><li><i class="lg extra"></i>fora do combinado</li><li><i class="lg pendente"></i>sem registro</li><li><i class="lg falta"></i>falta</li><li><i class="lg feriado"></i>feriado</li></ul>
    </section>
    ${railFoot()}
  </aside>`;
}

function novoEdit(d){const v=visitaDe(d);if(v)return{id:v.id,date:d,out:Object.assign({},v.out),in:Object.assign({},v.in),urg:!!v.urg,obs:v.obs||''};return{id:null,date:d,out:{cam:0,br:0,vm:0},in:{cam:0,br:0,vm:0},urg:false,obs:''}}
function levaInfo(){

function foraConta(k){const C=UI.conta,t=int(C['t'+k]),a=C['a'+k]===''?NaN:int(C['a'+k]);if(isNaN(t)||isNaN(a))return '—';return Math.max(0,t-a)}

function meses(){const s=new Set(S.recs.map(r=>r.date.slice(0,7)));s.add(HOJE.slice(0,7));return Array.from(s).sort()}
function mesPadrao(){const d=parse(HOJE);if(d.getDate()<=5)d.setDate(0);return iso(d).slice(0,7)}
function dadosMes(ym){
  const p=ym.split('-').map(Number), ini=ym+'-01', fim=iso(new Date(p[0],p[1],0)), ate=fim<HOJE?fim:HOJE;
  const recs=S.recs.filter(r=>r.date.slice(0,7)===ym), vis=recs.filter(r=>r.kind==='visita');
  const T={out:{cam:0,br:0,vm:0},in:{cam:0,br:0,vm:0}};vis.forEach(v=>{for(const k in T.out){T.out[k]+=v.out[k];T.in[k]+=v.in[k]}});
  const faltas=recs.filter(r=>r.kind==='falta'&&!visitaDe(r.date)).map(r=>r.date), pend=[];
  for(let d=ini;d<=ate;d=add(d,1))if(status(d)==='pendente')pend.push(d);
  const fora=vis.filter(v=>COMBINADO.indexOf(wd(v.date))<0), urg=vis.filter(v=>v.urg);
  let menos=0,mais=0,bateu=0;vis.forEach(v=>{const c=compara(v);if(!c)return;if(c.tipo==='ok')bateu++;else if(c.tipo==='menos')menos++;else mais++});
  const b1=saldo(ate), fers=S.feriados.filter(f=>f.date.slice(0,7)===ym).sort((a,b)=>a.date<b.date?-1:1);
  return{ym,ini,fim,ate,recs,vis,T,faltas,pend,fora,urg,menos,mais,bateu,b1,fers,nome:cap(MESES[p[1]-1])+' de '+p[0],parcial:ate<fim};
}
function frase(D){
  let t=plural(D.vis.length,'visita','visitas');
  if(D.fora.length)t+=` (${D.fora.length} fora do combinado${D.urg.length?', '+D.urg.length+' de urgência':''})`;
  t+=' e '+plural(D.faltas.length,'falta','faltas');
  if(D.pend.length)t+=', '+plural(D.pend.length,'dia sem registro','dias sem registro');
  return t;
}
function fechamento(D){const br=Math.max(0,Math.round(D.b1.br)),vm=Math.max(0,Math.round(D.b1.vm));return `${D.parcial?'Até hoje estão':'No fim do mês ficaram'} com a lavanderia <b>${kg(Math.max(0,D.b1.cam))} kg</b>, <b>${br}</b> ${br===1?'branco':'brancos'} e <b>${vm}</b> ${vm===1?'vermelho':'vermelhos'}.`}
function barras(D){
  const cm=Math.max(D.T.out.cam,D.T.in.cam,1),mm=Math.max(D.T.out.br,D.T.in.br,D.T.out.vm,D.T.in.vm,1);
  const L=(n,o,i,mx,f,band)=>{let bd='';if(band&&o>0){const fx=faixa(o);bd=`<i class="band" style="left:${fx.lo/mx*100}%;width:${(fx.hi-fx.lo)/mx*100}%" title="Faixa esperada de volta: ${kg(fx.lo)} a ${kg(fx.hi)} kg"></i>`}
    return `<div class="brow"><span class="bn">${n}</span><div class="bb" aria-hidden="true"><i class="bar out${o?"":" zero"}" style="width:${o/mx*100}%"></i><span class="track">${bd}<i class="bar in${i?"":" zero"}" style="width:${i/mx*100}%"></i></span></div><span class="bv"><span class="tout" aria-label="levaram">${f(o)}</span><span class="tin" aria-label="trouxeram">${f(i)}</span></span></div>`};
  return L('Camisolas, kg',D.T.out.cam,D.T.in.cam,cm,kg,true)+L('Mops brancos',D.T.out.br,D.T.in.br,mm,String)+L('Mops vermelhos',D.T.out.vm,D.T.in.vm,mm,String);
}
function fersTxt(D){return D.fers.length?'Feriados: '+D.fers.map(f=>`${dl(f.date)} (${esc(f.nome)}${visitaDe(f.date)?', vieram mesmo assim':''})`).join(', ')+'.':''}
function levasTxt(D){const n=D.menos+D.mais+D.bateu;if(!n)return '';return `Comparando com a leva da última entrega: ${plural(D.bateu,'visita bateu','visitas bateram')}, em ${D.menos} trouxeram menos que o esperado e em ${D.mais} trouxeram mais. A diferença acompanha a demanda do hospital.`}

const legenda='<div class="legend"><span><i class="sw out"></i>levaram</span><span><i class="sw in"></i>trouxeram</span><span><i class="sw faixa"></i>volta esperada (margem de sujidade)</span></div>';

  return `eLogística · ${D.nome}\n${cap(frase(D))}\nCamisolas: levaram ${kg(D.T.out.cam)} kg, trouxeram ${kg(D.T.in.cam)} kg${p}\nMops brancos: levaram ${D.T.out.br}, trouxeram ${D.T.in.br}\nMops vermelhos: levaram ${D.T.out.vm}, trouxeram ${D.T.in.vm}\n${D.parcial?'Até hoje':'No fim do mês'} com a lavanderia: ${kg(Math.max(0,D.b1.cam))} kg, ${br} brancos, ${vm} vermelhos\n${faltasTxt(D)}`;

function margemCurta(o,i){if(o<=0)return '';const p=(o-i)/o*100,c=S.config;return 'diferença '+pct(p)+' · '+(p>=c.smin&&p<=c.smax?'dentro da margem':p<c.smin?'abaixo da margem':'acima da margem')}
const TIPOS={visita:'Visita',extra:'Visita extra',urg:'Urgência',falta:'Falta',pendente:'Sem registro',feriado:'Feriado',ajuste:'Ajuste de mops'};
function eventosGeral(){
  const ev=S.recs.filter(r=>!(r.kind==='falta'&&visitaDe(r.date))).map(r=>r.kind==='visita'?Object.assign({tipo:r.urg?'urg':(COMBINADO.indexOf(wd(r.date))>=0?'visita':'extra')},r):Object.assign({tipo:r.kind},r));
  for(const f of S.feriados)if(f.date<=HOJE&&f.date>=primeiro()&&!visitaDe(f.date)&&!doDia(f.date).some(r=>r.kind==='falta'))ev.push({tipo:'feriado',kind:'feriado',date:f.date,nome:f.nome});
  for(let d=primeiro();d<HOJE;d=add(d,1))if(status(d)==='pendente')ev.push({tipo:'pendente',kind:'pendente',date:d});
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const run={cam:INICIAL.cam,br:INICIAL.br,vm:INICIAL.vm};
  for(const e of ev){if(e.kind==='visita'){for(const k in run)run[k]+=e.out[k]-e.in[k]}else if(e.kind==='ajuste'){for(const k in e.adj)run[k]+=e.adj[k]}e.saldo=Math.max(0,run.cam)}
  return ev;
}
function filtroGeral(e){const t=UI.gtipo||'todos',p=UI.gper||'todos';if(p!=='todos'&&e.date.slice(0,7)!==p)return false;if(t==='todos')return true;if(t==='visitas')return['visita','extra','urg'].indexOf(e.tipo)>=0;if(t==='faltas')return e.tipo==='falta'||e.tipo==='pendente';if(t==='feriados')return e.tipo==='feriado';if(t==='ajustes')return e.tipo==='ajuste';return true}
function obsDe(e){
  if(e.kind==='visita'){const c=compara(e),p=[];if(c)p.push(`leva de ${dd(c.L.date)}: ${c.curto}`);if(e.obs)p.push(e.obs);return p.join(' · ')}
  if(e.kind==='feriado')return e.nome;
  if(e.kind==='ajuste'){const p=[];if(e.adj.br)p.push((e.adj.br>0?'+':'')+e.adj.br+' brancos');if(e.adj.vm)p.push((e.adj.vm>0?'+':'')+e.adj.vm+' vermelhos');return 'contagem: '+(p.join(', ')||'sem diferença')}
  if(e.kind==='falta')return 'não vieram';

  return '';

/* Busca uma tabela inteira, em partes de 1000 linhas */
async function tudo(tab,cols,filtro){
  const out=[];
  for(let i=0;;i+=1000){let q=sb.from(tab).select('*');if(filtro)q=filtro(q);for(const c of cols)q=q.order(c,{ascending:true});
    const d=chk(await q.range(i,i+999));out.push(...d);if(d.length<1000)break}
  return out;
}
async function carregarMat(){
  let r;
  const vazio=Promise.resolve([]),tudoMov=leTudoMat(),meuP=PERF&&PERF.pessoa_id&&pode('mat.pedir','editar')?PERF.pessoa_id:null;
  try{r=await Promise.all([tudo('mat_materiais',['nome','id']),tudo('mat_pessoas',['nome','id']),
    pode('mat.painel','ver')?tudo('mat_pedidos',['data','criado_em','id'],q=>q.eq('status','pendente')):vazio,
    tudoMov?tudo('mat_movimentos',['data','criado_em','id']):vazio,
    meuP?tudo('mat_pedidos',['data','criado_em','id'],q=>q.eq('pessoa_id',meuP).gte('data',add(HOJE,-120))):vazio,
    tudoMov?Promise.resolve(null):sb.rpc('mat_saldos').then(chk)])}
  catch(e){if(semTabela(e)){M=MVAZIO();M.falta=true;return}throw e}
  const [mt,ps,pd,mv,me,sl]=r,saldo={};
  const movs=mv.map(x=>({id:x.id,date:x.data,tipo:x.tipo,mat:x.material_id,pes:x.pessoa_id||null,q:n0(x.quantidade),ped:x.pedido_id||null,obs:x.observacao||''}));
  if(sl)for(const x of sl)saldo[x.id]=n0(x.saldo);
  else for(const x of movs)saldo[x.mat]=(saldo[x.mat]||0)+(x.tipo==='saida'?-x.q:x.q);
  M={pronto:true,falta:false,erro:false,movs,
    meus:me.map(x=>({id:x.id,grupo:x.grupo||x.id,date:x.data,mat:x.material_id,q:n0(x.quantidade),status:x.status,entregue:x.entregue_em||null,criado:x.criado_em||''})),
    mats:mt.map(x=>({id:x.id,codigo:x.codigo==null?null:n0(x.codigo),nome:x.nome,tipo:x.tipo==='grafico'?'grafico':'brinde',min:x.minimo==null?null:n0(x.minimo),max:x.maximo==null?null:n0(x.maximo),ativo:x.ativo!==false,saldo:saldo[x.id]||0})).sort(porNome),
    pessoas:ps.map(x=>({id:x.id,nome:x.nome,setor:x.setor||'',ativo:x.ativo!==false})).sort(porNome),
    peds:pd.map(x=>({id:x.id,grupo:x.grupo||x.id,date:x.data,pes:x.pessoa_id,mat:x.material_id,q:n0(x.quantidade),obs:x.observacao||'',criado:x.criado_em||''}))};
}
const matDe=id=>M.mats.find(m=>m.id===id)||{id,nome:'Material removido',codigo:null,tipo:'brinde',min:null,max:null,ativo:false,saldo:0};
const pesDe=id=>M.pessoas.find(p=>p.id===id)||{id,nome:'Sem nome',setor:'',ativo:false};
function situ(m){if(m.saldo<=0)return 'acabou';if(m.min!=null&&m.saldo<m.min)return 'baixo';if(m.max!=null&&m.saldo>m.max)return 'acima';if(m.min==null&&m.max==null)return 'sem';return 'ok'}
const baixo=m=>m.ativo&&m.min!=null&&m.saldo<m.min;
const comprar=m=>Math.max(0,(m.max!=null?m.max:(m.min!=null?m.min:0))-Math.max(0,m.saldo));
const urgentes=a=>a.slice().sort((x,y)=>RANK[situ(x)]-RANK[situ(y)]||((x.min&&y.min)?x.saldo/x.min-y.saldo/y.min:0)||porNome(x,y));
/* Pedidos pendentes, juntando os itens pedidos de uma vez pela mesma pessoa */
function grupos(){
  const g={};
  for(const p of M.peds){(g[p.grupo]=g[p.grupo]||{id:p.grupo,date:p.date,pes:p.pes,criado:p.criado,itens:[]}).itens.push(p)}
  return Object.values(g).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.criado<b.criado?-1:1));

/* Quais itens do pedido o estoque de agora cobre */
function cobre(g){
  const resta={},ok=[],falta=[];
  for(const it of g.itens){if(!(it.mat in resta))resta[it.mat]=Math.max(0,matDe(it.mat).saldo);
    if(it.q<=resta[it.mat]){resta[it.mat]-=it.q;ok.push(it)}else falta.push({it,tem:resta[it.mat]})}
  return{ok,falta};
}

function vPCard(g){
  const p=pesDe(g.pes),c=cobre(g),todos=!c.falta.length,ob=g.itens.find(i=>i.obs);

  h+=`<ul class="pitens">${g.itens.map(it=>{const m=matDe(it.mat),f=c.falta.find(x=>x.it.id===it.id);return `<li><span class="pq">${un(it.q)}</span><span class="pn">${esc(m.nome)}</span><span class="pt${f?' falta':''}">${f?(f.tem>0?'tem só '+un(f.tem):'acabou'):'tem '+un(m.saldo)}</span></li>`}).join('')}</ul>`;
  if(!todos)h+=`<p class="paviso">${c.falta.map(f=>`Faltam ${un(f.it.q-f.tem)} de ${esc(matDe(f.it.mat).nome)}`).join('. ')}.${c.ok.length?' Dá para entregar o resto agora; o que faltar continua aqui.':''}</p>`;
  h+='<div class="row">';
  if(todos)h+=`<button class="btn" data-act="entregar" data-g="${g.id}">Entregar tudo</button>`;
  else{if(c.ok.length)h+=`<button class="btn" data-act="entregarok" data-g="${g.id}">Entregar o que tem</button>`;h+=`<button class="btn ghost" data-act="entregar" data-g="${g.id}">Entregar tudo mesmo assim</button>`}
  h+=`<span class="sp"></span><button class="link danger" data-act="cancelped" data-g="${g.id}">Cancelar pedido</button></div></article>`;
  return h;
}

const saidas=(ini,fim)=>M.movs.filter(x=>x.tipo==='saida'&&x.date>=ini&&x.date<=fim);
function mesesMat(){const s=new Set(M.movs.filter(x=>x.tipo==='saida').map(x=>x.date.slice(0,7)));s.add(HOJE.slice(0,7));return Array.from(s).sort()}
function navMes(){const ms=mesesMat(),i=ms.indexOf(UI.mmes);return `<div class="mnav"><button data-act="mmes" data-n="-1" aria-label="Mês anterior" ${i<=0?'disabled':''}>‹</button><span class="h2">${nomeMes(UI.mmes)}</span><button data-act="mmes" data-n="1" aria-label="Mês seguinte" ${i<0||i>=ms.length-1?'disabled':''}>›</button></div>`}
function vMRel(){
  const tab=UI.mrtab||'pessoas';if(!UI.mmes)UI.mmes=HOJE.slice(0,7);
  const tabs=[['pessoas','Quem mais pega'],['uso','Uso por material'],['repo','Reposição'],['movs','Movimentos']].map(t=>`<button role="tab" class="tab${tab===t[0]?' on':''}" aria-selected="${tab===t[0]}" data-act="mrtab" data-k="${t[0]}">${t[1]}</button>`).join('');
  const body=tab==='uso'?relUso():tab==='repo'?relRepo():tab==='movs'?relMovs():relPessoas();
  return `<div class="hrow"><h1 class="h1">Relatórios de materiais</h1></div><div class="tablist" role="tablist">${tabs}</div>${body}`;
}
function relPessoas(){
  const ym=UI.mmes,sd=saidas(ym+'-01',fimMes(ym)),por={};
  for(const x of sd){const r=por[x.pes]=por[x.pes]||{pes:x.pes,q:0,itens:[]};r.q+=x.q;r.itens.push(x)}
  const rk=Object.values(por).sort((a,b)=>b.q-a.q),mx=rk.length?rk[0].q:1,tot=somaQ(sd);
  let h=`<div class="hrow">${navMes()}<span class="sub">${itens(tot)} ${tot===1?'entregue':'entregues'}${rk.length?' para '+plural(rk.length,'pessoa','pessoas'):''}</span></div>`;
  if(!rk.length)return h+'<p class="sub">Nenhuma saída neste mês.</p>';
  h+=`<section class="bloco"><div class="rank">${rk.map(r=>{const p=pesDe(r.pes),ab=UI.mpes===r.pes;
    let s=`<button class="brow" data-act="mpes" data-id="${r.pes}" aria-expanded="${ab}"><span class="bn">${esc(p.nome)}${p.setor?`<small>${esc(p.setor)}</small>`:''}</span><span class="bb"><i class="bar out" style="width:${r.q/mx*100}%"></i></span><span class="bv">${un(r.q)}</span></button>`;
    if(ab){const pm={};r.itens.forEach(x=>{pm[x.mat]=(pm[x.mat]||0)+x.q});
      s+=`<div class="det"><ul class="minis">${Object.keys(pm).sort((a,b)=>pm[b]-pm[a]).map(k=>`<li><span>${esc(matDe(k).nome)}</span><span class="en">${un(pm[k])}</span></li>`).join('')}</ul><p class="note">Dias: ${Array.from(new Set(r.itens.map(x=>x.date))).sort().map(dl).join(', ')}.</p></div>`}
    return s}).join('')}</div><p class="note">Toque no nome para ver o que a pessoa pegou e em que dias.</p></section>`;
  return h;
}
function colsUso(){
  const ym=UI.mmes,cols=[];
  if((UI.muso||'semana')==='semana'){const ini=ym+'-01',fim=fimMes(ym);for(let s=weekStart(ini);s<=fim;s=add(s,7)){const a=s<ini?ini:s,b=add(s,6)>fim?fim:add(s,6);cols.push({t:a===b?dd(a):dd(a)+' a '+dd(b),a,b})}}
  else{const p=ym.split('-').map(Number);for(let k=5;k>=0;k--){const d=new Date(p[0],p[1]-1-k,1),m=iso(d).slice(0,7);cols.push({t:cap(MESES[d.getMonth()]),a:m+'-01',b:fimMes(m)})}}
  return cols;
}
function relUso(){
  const modo=UI.muso||'semana',cols=colsUso(),sd=saidas(cols[0].a,cols[cols.length-1].b),lin={};
  for(const x of sd){const i=cols.findIndex(c=>x.date>=c.a&&x.date<=c.b);if(i<0)continue;const l=lin[x.mat]=lin[x.mat]||{mat:x.mat,v:cols.map(()=>0),t:0};l.v[i]+=x.q;l.t+=x.q}
  const rows=Object.values(lin).sort((a,b)=>b.t-a.t||porNome(matDe(a.mat),matDe(b.mat)));
  const seg=`<div class="seg" role="group" aria-label="Agrupar por"><button data-act="muso" data-k="semana" aria-pressed="${modo==='semana'}">Semana</button><button data-act="muso" data-k="mes" aria-pressed="${modo==='mes'}">Mês</button></div>`;
  let h=`<div class="hrow">${navMes()}${seg}</div><p class="note">${modo==='semana'?'Quanto saiu de cada material em cada semana do mês (segunda a domingo).':'Quanto saiu de cada material nos últimos seis meses, para ver se o consumo está subindo.'}</p>`;

function numOuNada(t){if(t==='')return null;if(!/^\d[\d.]*$/.test(t))return NaN;return int(t)}
async function salvaMat(){
  const C=UI.cad,nome=valor('cm-nome').replace(/\s+/g,' '),cod=numOuNada(valor('cm-cod')),mi=numOuNada(valor('cm-min')),ma=numOuNada(valor('cm-max'));
  const sal=C.id==='novo'?numOuNada(valor('cm-saldo')):null;
  if(!nome){erro('Digite o nome do material.');return}
  if([cod,mi,ma,sal].some(x=>x!==null&&isNaN(x))){erro('Código, mínimo, máximo e quantidade aceitam só números.');return}
  if(mi!=null&&ma!=null&&mi>ma){erro('O mínimo não pode ser maior que o máximo.');return}
  if(M.mats.some(m=>m.id!==C.id&&semAc(m.nome)===semAc(nome))){erro('Já existe um material com esse nome.');return}
  const velho=C.id!=='novo'?M.mats.find(m=>m.id===C.id):null,row={nome,codigo:cod,tipo:C.tipo,minimo:mi,maximo:ma};let id=null;
  const ok=await exec(async()=>{
    if(velho)chk(await sb.from('mat_materiais').update(row).eq('id',velho.id));
    else{id=chk(await sb.from('mat_materiais').insert(row).select('id').single()).id;
      if(sal>0)chk(await sb.from('mat_movimentos').insert({data:HOJE,tipo:'ajuste',material_id:id,quantidade:sal,observacao:'Saldo inicial'}))}
  },async()=>{
    if(velho)chk(await sb.from('mat_materiais').update({nome:velho.nome,codigo:velho.codigo,tipo:velho.tipo,minimo:velho.min,maximo:velho.max}).eq('id',velho.id));
    else{chk(await sb.from('mat_movimentos').delete().eq('material_id',id));chk(await sb.from('mat_materiais').delete().eq('id',id))}
  },MLOAD);
  if(ok){UI.cad=null;render();toast(velho?`${nome} atualizado.`:`${nome} cadastrado.`,true)}
}
async function arqMat(id){
  const m=M.mats.find(x=>x.id===id);if(!m)return;
  const ok=await exec(async()=>{chk(await sb.from('mat_materiais').update({ativo:!m.ativo}).eq('id',id))},async()=>{chk(await sb.from('mat_materiais').update({ativo:m.ativo}).eq('id',id))},MLOAD);
  if(ok){UI.cad=null;render();toast(m.ativo?`${m.nome} arquivado.`:`${m.nome} reativado.`,true)}
}
function copiar(txt,msg){const fb=()=>{UI.copyfb=true;render();const t=document.getElementById('copyfb');if(t){t.value=txt;t.hidden=false;t.focus();t.select()}toast('Selecione o texto abaixo e copie.')};
  try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fb)}catch(e){fb()}}
const tsvDe=L=>L.map(l=>l.map(celula).join('\t')).join('\n');
const csvDe=L=>L.map(l=>l.map(c=>{c=celula(c);return /[;"]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
function baixarArq(nome,txt){
  const blob=new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
/* Cliques da área de materiais. Devolve true se tratou. */
function cliqueMat(a,b){
  const id=b.dataset.id;
  switch(a){
    case 'modo':go(inicial(b.dataset.m));return true;
    case 'mrecarregar':carregarMat().then(render).catch(e=>{console.error(e);toast('Ainda não foi possível carregar. Verifique a internet.')});return true;
    case 'mfiltro':UI.mf=b.dataset.k;if(UI.view==='m-estoque')render();else go('m-estoque');return true;
    case 'mrtab':UI.mrtab=b.dataset.k;UI.copyfb=false;if(UI.view==='m-rel')render();else go('m-rel');return true;
    case 'pedpes':UI.ped.pes=id;document.querySelectorAll('.pchip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.id===id)));marcaLinha('');return true;
    case 'pq':{const P=UI.ped,q=Math.max(0,(P.q[id]||0)+Number(b.dataset.n));if(q)P.q[id]=q;else delete P.q[id];const i=document.querySelector(`.pqin[data-id="${id}"]`);if(i)i.value=q||'';marcaLinha(id);return true}
    case 'pedagora':salvarPed(true);return true;
    case 'pedlater':salvarPed(false);return true;
    case 'pedcancela':UI.ped=null;go('m-painel');return true;
    case 'entregar':entregar(b.dataset.g,false);return true;
    case 'entregarok':entregar(b.dataset.g,true);return true;
    case 'cancelped':cancelarPed(b.dataset.g);return true;
    case 'mentrada':UI.ent={mat:id,q:'',date:HOJE,obs:''};UI.entVolta=UI.view==='m-material'?'m-material':'m-painel';go('m-entrada');{const q=document.getElementById('e-q');if(q)q.focus()}return true;
    case 'salvaent':salvaEnt();return true;
    case 'entcancela':{const v=UI.entVolta||'m-painel';UI.ent=null;go(v);return true}
    case 'mmat':UI.mat=id;UI.corr=false;UI.mmais=false;go('m-material');return true;
    case 'mcorr':UI.corr=true;render();{const c=document.getElementById('c-real');if(c)c.focus()}return true;
    case 'fechacorr':UI.corr=false;render();return true;
    case 'salvacorr':salvaCorr();return true;
    case 'delmov':delMov(id);return true;
    case 'mmais':UI.mmais=true;render();return true;
    case 'mcadmat':UI.cad={k:'mat',id,tipo:matDe(id).tipo};go('m-cad');return true;
    case 'mmes':{const ms=mesesMat(),i=ms.indexOf(UI.mmes)+Number(b.dataset.n);if(ms[i]){UI.mmes=ms[i];UI.mpes=null;render()}return true}
    case 'muso':UI.muso=b.dataset.k;render();return true;
    case 'mpes':UI.mpes=UI.mpes===id?null:id;render();return true;
    case 'copiarepo':copiar(textoRepo(),'Lista copiada. É só colar no WhatsApp ou no e-mail.');return true;
    case 'csvrepo':baixarArq('eLogistica - lista de reposicao.csv',csvDe(linhasRepo()));return true;
    case 'copiamovs':copiar(tsvDe(linhasMovs()),'Planilha copiada. Cole numa planilha do Excel ou do Google.');return true;
    case 'csvmovs':baixarArq('eLogistica - movimentos de materiais.csv',csvDe(linhasMovs()));return true;
    case 'cadpes':UI.cad={k:'pes',id};render();{const n=document.getElementById('cp-nome');if(n)n.focus()}return true;
    case 'cadmat':UI.cad={k:'mat',id,tipo:id==='novo'?'brinde':matDe(id).tipo};render();{const n=document.getElementById('cm-nome');if(n)n.focus()}return true;
    case 'cadfecha':UI.cad=null;render();return true;
    case 'cmtipo':UI.cad.tipo=b.dataset.k;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return true;
    case 'salvapes':salvaPes();return true;
    case 'arqpes':arqPes(id);return true;
    case 'salvamat':salvaMat();return true;
    case 'arqmat':arqMat(id);return true;
    case 'salvainv':salvaInv();return true;
    case 'invlimpa':invCarrega();if(Object.keys(UI.inv.q).length&&!b.dataset.ok){b.dataset.ok='1';b.textContent='Toque de novo para apagar';setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.textContent='Apagar contagem'}},4000);return true}UI.inv.q={};invGuarda();render();toast('Contagem apagada.');return true;
  }
  return false;
}
function inputMat(t){
  if((UI.view==='m-anotar'||UI.view==='m-pedir')&&UI.ped){
    if(t.id==='p-busca'){UI.ped.busca=t.value;document.getElementById('p-lista').innerHTML=listaPed();return}
    if(t.classList.contains('pqin')){const d=t.value.replace(/\D/g,'');if(d!==t.value)t.value=d;const q=d?Math.min(99999,int(d)):0;if(q)UI.ped.q[t.dataset.id]=q;else delete UI.ped.q[t.dataset.id];marcaLinha(t.dataset.id);return}
    if(t.id==='p-obs'){UI.ped.obs=t.value;return}
  }
  if(UI.view==='m-inv'&&UI.inv){
    if(t.id==='i-busca'){UI.inv.busca=t.value;document.getElementById('i-lista').innerHTML=invLinhas();return}
    if(t.classList.contains('invin')){const d=t.value.replace(/\D/g,'');if(d!==t.value)t.value=d;const id=t.dataset.id;if(d==='')delete UI.inv.q[id];else UI.inv.q[id]=String(Math.min(999999,int(d)));invGuarda();
      const r=t.closest('.invrow'),f=invDif(matDe(id));if(r){r.classList.toggle('feito',d!=='');const c=r.querySelector('.dif');c.className='dif '+f.cls;c.textContent=f.txt}
      document.getElementById('i-res').innerHTML=invResumo();return}
  }
  if(t.id==='m-busca'){UI.mbusca=t.value;document.getElementById('m-elist').innerHTML=linhasEst();return}
  if(UI.view==='m-entrada'&&UI.ent){
    if(t.id==='e-q'){const d=t.value.replace(/\D/g,'');if(d!==t.value)t.value=d;UI.ent.q=d}
    else if(t.id==='e-obs'){UI.ent.obs=t.value;return}
    const r=document.getElementById('e-res');if(r)r.innerHTML=resEnt();const e=document.getElementById('ferr');if(e)e.hidden=true;return;
  }
  if(t.id==='c-real'){const m=matDe(UI.mat),v=t.value.trim()===''?NaN:int(t.value),r=document.getElementById('c-res');
    if(r)r.textContent=isNaN(v)?'':(v===m.saldo?'Igual ao que o sistema mostra. Nada muda.':`O sistema mostra ${un(m.saldo)}. Vai lançar uma correção de ${v>m.saldo?'+':'−'}${un(Math.abs(v-m.saldo))}.`);
    const e=document.getElementById('ferr');if(e)e.hidden=true;return}
  if(/^c[pm]-/.test(t.id)){const e=document.getElementById('ferr');if(e)e.hidden=true}
}
function changeMat(t){
  if(t.id==='p-data'&&UI.ped){UI.ped.date=t.value&&t.value<=HOJE?t.value:HOJE;if(t.value!==UI.ped.date)t.value=UI.ped.date;return true}
  if(t.id==='e-mat'&&UI.ent){UI.ent.mat=t.value;const r=document.getElementById('e-res');if(r)r.innerHTML=resEnt();return true}
  if(t.id==='e-data'&&UI.ent){UI.ent.date=t.value&&t.value<=HOJE?t.value:HOJE;if(t.value!==UI.ent.date)t.value=UI.ent.date;return true}
  if(t.id==='mv-per'){UI.mper=t.value;UI.copyfb=false;render();return true}
  if(t.id==='mv-tp'){UI.mtp=t.value;UI.copyfb=false;render();return true}
  return false;
}

const parteDe=k=>TODAS.find(i=>i.k===k);
const nomeNivel=(it,v)=>v==='editar'?(it.k==='mat.pedir'?'Pode pedir':'Pode alterar'):v==='ver'?'Só vê':'Não acessa';
/* PERF: perfil de quem entrou. null = banco ainda sem a consulta 12 (acesso total, como antes) */

const pode=(k,n)=>nivel(k)>=(n==='editar'?2:1);

async function carregarPerfil(){
  const r=await sb.rpc('app_meu_perfil');

/* Que telas cada parte libera */
const TELAS={hoje:['lav.visitas','ver'],semanas:['lav.visitas','ver'],registrar:['lav.visitas','editar'],relatorios:['lav.relatorios','ver'],contar:['lav.ajustes','editar'],ajustes:['lav.ajustes','ver'],
  'm-painel':['mat.painel','ver'],'m-anotar':['mat.painel','editar'],'m-entrada':['mat.estoque','editar'],'m-estoque':['mat.estoque','ver'],'m-material':['mat.estoque','ver'],'m-inv':['mat.estoque','editar'],

function permitido(v){const t=TELAS[v];return !t||pode(t[0],t[1])}

const acaoLiberada=a=>!ACAO[a]||pode(ACAO[a],'editar');
/* Depois de desenhar a tela, tira os botões que a pessoa não pode usar */
function podar(){
  document.querySelectorAll('#app [data-act]').forEach(e=>{const a=e.dataset.act;if(!acaoLiberada(a)||(a==='go'&&!permitido(e.dataset.v))||(a==='modo'&&false))e.remove()});
  if(!pode('lav.ajustes','editar')){const f=document.getElementById('ferform');if(f)f.remove();document.querySelectorAll('.cfg input').forEach(i=>i.disabled=true)}
  document.querySelectorAll('#app .row:empty,#app .cta-d:empty').forEach(e=>e.remove());
}

function vMMeus(){
  const g={};for(const p of M.meus){(g[p.grupo]=g[p.grupo]||{id:p.grupo,date:p.date,criado:p.criado,itens:[]}).itens.push(p)}
  const gs=Object.values(g).sort((a,b)=>a.date>b.date?-1:a.date<b.date?1:(a.criado>b.criado?-1:1));
  let h=`<div class="hrow"><h1 class="h1">Meus pedidos</h1><button class="btn cta-d" data-act="go" data-v="m-pedir">Pedir material</button></div><button class="btn cta-m" data-act="go" data-v="m-pedir">Pedir material</button>`;
  if(!gs.length)return h+'<p class="sub">Você ainda não fez nenhum pedido pelo site.</p>';
  h+=`<div class="pcards">${gs.map(x=>{const pend=x.itens.filter(i=>i.status==='pendente'),ent=x.itens.filter(i=>i.status==='entregue');
    const st=pend.length?(ent.length?'Parte entregue, o resto aguarda':'Aguardando entrega'):ent.length?'Entregue em '+dl(ent[0].entregue||x.date):'Cancelado';
    const cls=pend.length?'pend':ent.length?'ok':'canc';
    return `<article class="pcard"><div class="shead"><p class="ps">Pedido de ${dl(x.date)}</p><span class="stp ${cls}">${st}</span></div><ul class="pitens">${x.itens.map(i=>`<li><span class="pq">${un(i.q)}</span><span class="pn">${esc(matDe(i.mat).nome)}</span><span class="pt">${i.status==='entregue'?'entregue':i.status==='cancelado'?'cancelado':'aguardando'}</span></li>`).join('')}</ul>${pend.length?`<div class="row"><button class="link danger" data-act="meucancela" data-g="${x.id}">Cancelar o que ainda não foi entregue</button></div>`:''}</article>`}).join('')}</div>`;
  return h+'<p class="note">Mostrando os pedidos dos últimos 4 meses.</p>';
}
async function enviarPedido(){
  const P=UI.ped,its=itensPed();
  if(!its.length){erro('Escolha pelo menos um material e a quantidade.');return}
  if(its.some(i=>i.q>99999)){erro('Quantidade grande demais. Confira o número.');return}
  const grupo=uid(),obs=P.obs.trim()||null,rows=its.map(i=>({grupo,data:HOJE,pessoa_id:PERF.pessoa_id,material_id:i.mat,quantidade:i.q,observacao:obs}));
  let ids=[];
  const ok=await exec(async()=>{ids=chk(await sb.from('mat_pedidos').insert(rows).select('id')).map(r=>r.id)},
    async()=>{chk(await sb.from('mat_pedidos').update({status:'cancelado'}).in('id',ids))},MLOAD);
  if(ok){UI.ped=null;go('m-meus');toast(`Pedido enviado: ${itens(somaQ(its))}. Você é avisado aqui quando for entregue.`,true)}
}
async function cancelarMeu(gid){
  const ids=M.meus.filter(p=>p.grupo===gid&&p.status==='pendente').map(p=>p.id);if(!ids.length)return;
  const ok=await exec(async()=>{chk(await sb.from('mat_pedidos').update({status:'cancelado'}).in('id',ids))},
    async()=>{chk(await sb.from('mat_pedidos').update({status:'pendente'}).in('id',ids))},MLOAD);
  if(ok){render();toast('Pedido cancelado.',true)}
}

/* ---------- Usuários e acessos ---------- */
let AC={pronto:false,usuarios:[],grupos:[]};
async function carregarAcessos(){
  const [u,g]=await Promise.all([(async()=>chk(await sb.from('app_usuarios').select('*').order('nome',{ascending:true})))(),(async()=>chk(await sb.from('app_grupos').select('*').order('nome',{ascending:true})))()]);
  AC={pronto:true,usuarios:u.map(x=>({id:x.user_id,nome:x.nome,email:x.email,grupo:x.grupo_id,pessoa:x.pessoa_id||'',ativo:x.ativo!==false})),
    grupos:g.map(x=>({id:x.id,nome:x.nome,desc:x.descricao||'',prog:!!x.programador,perm:x.permissoes||{}})).sort((a,b)=>(b.prog-a.prog)||a.nome.localeCompare(b.nome,'pt-BR'))};
}
const grupoDe=id=>AC.grupos.find(g=>g.id===id)||{nome:'—',perm:{},prog:false,desc:''};
function resumoPerm(g){
  if(g.prog)return '<span>Acesso total, inclusive às funções de programador.</span>';
  const alt=[],ver=[];for(const it of TODAS){const v=g.perm[it.k];if(v==='editar')alt.push(it.k==='mat.pedir'?'Pedir material':it.t);else if(v==='ver')ver.push(it.t)}
  if(!alt.length&&!ver.length)return '<span class="falta">Ainda não acessa nada.</span>';
  return (alt.length?`<span><b>Pode alterar:</b> ${alt.join(', ')}</span>`:'')+(ver.length?`<span><b>Só vê:</b> ${ver.join(', ')}</span>`:'');
}

const ACLOAD=()=>carregarAcessos();
async function chamaUsuarios(corpo){
  const r=await sb.functions.invoke('usuarios',{body:corpo});
  if(!r.error&&r.data&&!r.data.erro)return r.data;
  let msg=r.data&&r.data.erro;
  if(!msg&&r.error){const c=r.error.context,st=c&&c.status;let j=null;try{if(c&&typeof c.json==='function')j=await c.json()}catch(e){}
    msg=j&&(j.erro||j.message||j.msg);
    if(msg&&/invalid jwt|jwt/i.test(msg))msg='O Supabase barrou o pedido antes da função. Na função "usuarios", desligue "Verify JWT" e tente de novo.';
    if(!msg)msg=r.error.name==='FunctionsFetchError'?'Não consegui falar com a função "usuarios". Confira se ela existe com esse nome exato e desligue "Verify JWT" nela.':st===404?'A função "usuarios" não foi encontrada no Supabase. Confira se o nome está exatamente assim, em minúsculo.':'A função "usuarios" respondeu com erro '+(st||'')+'. Veja os logs dela no Supabase.'}
  if(!msg)msg='Não foi possível salvar. Verifique a internet e tente de novo.';
  const e=new Error(msg);e.usuario=true;throw e;
}

async function salvaUsuario(){
  const F=UI.acf,novo=F.id==='novo';
  F.nome=valor('af-nome');F.email=valor('af-email').toLowerCase();F.senha=document.getElementById('af-senha').value;F.pessoa=document.getElementById('af-pessoa').value;
  const b=document.getElementById('af-bloq');if(b)F.ativo=!b.checked;
  if(!F.nome){erro('Digite o nome.');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(F.email)){erro('Digite um e-mail válido.');return}
  if(novo&&F.senha.length<8){erro('A senha precisa ter pelo menos 8 caracteres.');return}
  if(!novo&&F.senha&&F.senha.length<8){erro('A nova senha precisa ter pelo menos 8 caracteres.');return}
  if(!F.grupo){erro('Escolha o grupo de acesso.');return}
  if(AC.usuarios.some(u=>u.id!==F.id&&u.email.toLowerCase()===F.email)){erro('Já existe um login com esse e-mail.');return}
  let msg='';
  const ok=await exec(async()=>{try{await chamaUsuarios({acao:novo?'criar':'alterar',id:novo?undefined:F.id,nome:F.nome,email:F.email,senha:F.senha||undefined,grupo_id:F.grupo,pessoa_id:F.pessoa||null,ativo:F.ativo})}catch(e){msg=e.message;throw e}},null,ACLOAD);
  if(ok){const proprio=!novo&&PERF&&F.id===UI.meuId;UI.acf=null;if(proprio){await carregarPerfil()}render();toast(novo?`Acesso de ${F.nome} criado. Passe o e-mail e a senha para a pessoa.`:`Acesso de ${F.nome} atualizado.`)}
  else if(msg){render();erro(msg)}
}
async function salvaGrupo(){
  const G=UI.grf;G.nome=valor('gf-nome').replace(/\s+/g,' ');G.desc=valor('gf-desc');
  if(!G.nome){erro('Dê um nome para o grupo.');return}
  if(AC.grupos.some(g=>g.id!==G.id&&semAc(g.nome)===semAc(G.nome))){erro('Já existe um grupo com esse nome.');return}
  const perm={};for(const k in G.perm)if(G.perm[k])perm[k]=G.perm[k];
  if(!Object.keys(perm).length){erro('Escolha pelo menos uma parte do site que o grupo acessa.');return}
  const row={nome:G.nome,descricao:G.desc||null,permissoes:perm},velho=G.id!=='novo'?AC.grupos.find(g=>g.id===G.id):null;let id=null;
  const ok=await exec(async()=>{if(velho)chk(await sb.from('app_grupos').update(row).eq('id',velho.id));else id=chk(await sb.from('app_grupos').insert(row).select('id').single()).id},
    async()=>{if(velho)chk(await sb.from('app_grupos').update({nome:velho.nome,descricao:velho.desc||null,permissoes:velho.perm}).eq('id',velho.id));else chk(await sb.from('app_grupos').delete().eq('id',id))},ACLOAD);
  if(ok){UI.grf=null;if(PERF&&!PERF.programador)await carregarPerfil();render();toast(velho?`Grupo ${G.nome} salvo. Vale na próxima vez que as pessoas abrirem o site.`:`Grupo ${G.nome} criado.`,true)}
}
async function excluiGrupo(id){
  const g=AC.grupos.find(x=>x.id===id);if(!g)return;
  const ok=await exec(async()=>{chk(await sb.from('app_grupos').delete().eq('id',id))},async()=>{chk(await sb.from('app_grupos').insert({id:g.id,nome:g.nome,descricao:g.desc||null,permissoes:g.perm}))},ACLOAD);
  if(ok){render();toast(`Grupo ${g.nome} excluído.`,true)}
}

  const id=b.dataset.id;
  switch(a){
    case 'pedenvia':enviarPedido();return true;
    case 'meucancela':cancelarMeu(b.dataset.g);return true;
    case 'acnovo':UI.grf=null;UI.acf={id:'novo',nome:'',email:'',senha:'',grupo:'',pessoa:'',ativo:true};render();{const n=document.getElementById('af-nome');if(n)n.focus()}return true;
    case 'aced':{const u=AC.usuarios.find(x=>x.id===id);if(!u)return true;UI.grf=null;UI.acf={id:u.id,nome0:u.nome,nome:u.nome,email:u.email,senha:'',grupo:u.grupo,pessoa:u.pessoa,ativo:u.ativo};render();{const f=document.querySelector('.acform');if(f)f.scrollIntoView({block:'start'})}return true}

    case 'vsenha':{const i=document.getElementById('af-senha');if(i){const m=i.type==='password';i.type=m?'text':'password';b.textContent=m?'Esconder':'Mostrar'}return true}
    case 'grnovo':UI.acf=null;UI.grf={id:'novo',nome:'',desc:'',perm:{}};render();{const f=document.querySelector('.gform');if(f)f.scrollIntoView({block:'start'});const n=document.getElementById('gf-nome');if(n)n.focus({preventScroll:true})}return true;
    case 'gred':{const g=AC.grupos.find(x=>x.id===id);if(!g)return true;UI.acf=null;UI.grf={id:g.id,nome:g.nome,desc:g.desc,perm:Object.assign({},g.perm)};render();{const f=document.querySelector('.gform');if(f)f.scrollIntoView({block:'start'})}return true}
    case 'grfecha':UI.grf=null;render();return true;
    case 'gperm':{const G=UI.grf,k=b.dataset.k,v=b.dataset.v;if(v)G.perm[k]=v;else delete G.perm[k];b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x===b)));const r=document.getElementById('gf-res');if(r)r.innerHTML=resumoPerm({perm:G.perm});return true}
    case 'grsalva':salvaGrupo();return true;
    case 'grdel':excluiGrupo(id);return true;
    case 'menu':UI.menu=!UI.menu;render();return true;
  }
  return false;
}

const VIEWS=['hoje','registrar','contar','relatorios','semanas','ajustes','entrar','m-painel','m-anotar','m-entrada','m-estoque','m-material','m-rel','m-cad','m-inv','m-pedir','m-meus','s-acessos'];
function go(v,keep){
  if(!logado&&v!=='entrar')v='entrar';
  if(v!=='entrar'&&!permitido(v))v=inicial(v.indexOf('m-')===0?'mat':'');
  if(v.indexOf('m-')===0)UI.area='mat';else if(v!=='entrar'&&v.indexOf('s-')!==0)UI.area='lav';
  UI.menu=false;
  if(v!=='s-acessos'){UI.acf=null;UI.grf=null}
  if(v==='s-acessos'&&logado&&PERF!==undefined){AC.pronto=false;carregarAcessos().then(()=>{if(UI.view==='s-acessos')render()}).catch(e=>{falha(e);if(UI.view==='s-acessos'){AC.pronto=true;render()}})}
  if(v==='registrar'&&!UI.edit)UI.edit=novoEdit(HOJE);
  if(v!=='registrar')UI.edit=null;
  if(v!=='contar')UI.conta=null;
  if(v!=='hoje'&&!keep)UI.ask=null;
  if(v==='m-material'&&!UI.mat)v='m-estoque';
  if(v!=='m-material')UI.corr=false;
  if(v!=='m-entrada'){UI.ent=null;UI.entVolta=null}
  if(v!=='m-cad')UI.cad=null;
  UI.view=v;UI.copyfb=false;
  try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}catch(e){}
  render();
  const m=document.getElementById('main');if(m){window.scrollTo(0,0);m.focus({preventScroll:true})}
}
let tt;
function toast(msg,undo){const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span>${undo&&UI.undo?'<button data-act="desfazer">Desfazer</button>':''}`;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},7000)}
function erro(msg){const e=document.getElementById('ferr');if(e){e.textContent=msg;e.hidden=false}}
const isAuthErr=e=>!!e&&(e.status===401||e.code==='PGRST301'||/jwt|not authorized|permission denied/i.test(e.message||''));
function falha(e){
  console.error(e);
  if(e&&e.usuario){toast(e.message);return}
  if(e&&/row-level security/i.test(e.message||'')){toast('Seu acesso não permite fazer isso.');return}
  if(isAuthErr(e)){logado=false;toast('Sua sessão expirou. Entre de novo.');go('entrar');return}
  if(e&&e.code==='PGRST202'){toast(/mat_/.test(e.message||'')?'Falta rodar no Supabase a consulta 09 (entrega de pedidos).':'Falta rodar no Supabase a consulta 06 (função de contagem de mops).');return}
  if(semTabela(e)){toast('Falta rodar no Supabase as consultas 07 a 11 (materiais).');return}
  if(e&&e.code==='23505'){toast('Já existe um cadastro com esse nome.');return}
  toast('Não foi possível salvar. Verifique a internet e tente de novo.');
}
let ocupado=false;
/* Faz a alteração no banco, recarrega tudo e guarda como desfazer */
async function exec(fn,desfazer,loader){
  loader=loader||carregar;
  if(ocupado)return false;ocupado=true;document.body.classList.add('busy');
  try{await fn();await loader();UI.undo=desfazer?{fn:desfazer,loader}:null;return true}
  catch(e){falha(e);try{await loader()}catch(_){}render();return false}
  finally{ocupado=false;document.body.classList.remove('busy')}
}
function abrir(d){if(d>HOJE){toast('Esse dia ainda não chegou.');return}UI.edit=novoEdit(d);UI.ask=null;go('registrar')}
function dia(d){
  if(!pode('lav.visitas','editar')){toast('Seu acesso à lavanderia é só para ver.');return}
  const st=status(d);
  if(d>HOJE){toast('Esse dia ainda não chegou.');return}
  if(st==='pendente'||st==='falta'){UI.ask=d;go('hoje',true);return}
  abrir(d);
}
const faltasDo=d=>S.recs.filter(r=>r.date===d&&r.kind==='falta');
const voltaFaltas=async fs=>{for(const f of fs)chk(await sb.from('lav_visitas').insert({id:f.id,data:f.date,tipo:'falta',observacao:f.obs||null}))};
async function salvar(){
  const e=UI.edit;
  if(e.date>HOJE){erro('Esse dia ainda não chegou.');return}
  if(e.date<=INICIAL.date){erro(`Antes de ${dd(add(INICIAL.date,1))}/${INICIAL.date.slice(0,4)} o saldo inicial já cobre tudo. Escolha uma data a partir desse dia.`);return}
  if(isNaN(e.out.cam)||isNaN(e.in.cam)){erro('Peso inválido. Use só números, por exemplo 106,5.');return}
  const tot=e.out.cam+e.in.cam+e.out.br+e.in.br+e.out.vm+e.in.vm;
  if(!tot){erro('Preencha pelo menos um campo. Se ninguém veio, use “Não vieram”.');return}
  const antigo=e.id?S.recs.find(r=>r.id===e.id):null;
  const rec={date:e.date,out:Object.assign({},e.out),in:Object.assign({},e.in),urg:COMBINADO.indexOf(wd(e.date))<0&&!!e.urg,obs:(e.obs||'').trim()};
  const fs=faltasDo(e.date);let novoId=null;
  const ok=await exec(async()=>{
    if(antigo)chk(await sb.from('lav_visitas').update(visitaRow(rec)).eq('id',antigo.id));
    else novoId=chk(await sb.from('lav_visitas').insert(visitaRow(rec)).select('id').single()).id;
    if(fs.length)chk(await sb.from('lav_visitas').delete().in('id',fs.map(f=>f.id)));
  },async()=>{
    if(antigo)chk(await sb.from('lav_visitas').update(visitaRow(antigo)).eq('id',antigo.id));
    else if(novoId)chk(await sb.from('lav_visitas').delete().eq('id',novoId));
    await voltaFaltas(fs);
  });
  if(ok){go('hoje');toast(`Visita de ${dl(e.date)} salva.`,true)}
}

async function desmarcaFalta(d){
